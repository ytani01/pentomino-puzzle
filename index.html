<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pentomino Puzzle</title>
<!--
  favicon（TODO-029）。指定が無いとブラウザが /favicon.ico を取りに行き、
  ローカルサーバのログが 404 で埋まって本物の不具合を追いにくい。
  画像アセットを持たない方針なので、F ペントミノの形を SVG で書いて
  data: URI で埋める（ファイルを増やさず、公開手順にも触らずに済む）。
  色は src/config.js の F の色（0xda3e3e）と地の色に揃えてあるが、
  link は Phaser の起動前に要るので、ここだけ直に書いている。
  URL の中で # は使えないので %23 に置き換えてある。
-->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23181b26'/><g fill='%23da3e3e'><rect x='12' y='3' width='8' height='8' rx='1.5'/><rect x='21' y='3' width='8' height='8' rx='1.5'/><rect x='3' y='12' width='8' height='8' rx='1.5'/><rect x='12' y='12' width='8' height='8' rx='1.5'/><rect x='12' y='21' width='8' height='8' rx='1.5'/></g></svg>">
<style>
  /* CSS が持つのは画面の地の色だけ。ほかの色は src/config.js にある。 */
  html, body {
    margin: 0;
    padding: 0;
    /* スマホのアドレスバーぶんまで含めた高さになる端末があるため、
       対応環境では動的ビューポート高さ（dvh）を使い、実際に見える
       範囲に収める。100% は dvh 非対応環境向けのフォールバック。 */
    height: 100%;
    height: 100dvh;
    background: #181b26;
    color: #8d97b0;
    font-family: system-ui, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
  }
  #app {
    width: 100%;
    height: 100%;
  }
  #app canvas {
    display: block;
    /* 指で操作するとき、ドラッグが画面のスクロールに取られないようにする。 */
    touch-action: none;
  }
  /* id 指定は [hidden] の display:none より強いので、消えるほうも明示しておく。 */
  #notice[hidden] {
    display: none;
  }
  #notice {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 0.8em;
    padding: 2em;
    text-align: center;
    line-height: 1.7;
  }
  #notice code {
    background: #212636;
    padding: 0.2em 0.5em;
    border-radius: 4px;
    color: #e8ecf4;
  }
</style>
</head>
<body>
<!--
  id は "game" にしない。要素の id は同じ名前のグローバル変数になるので、
  src/main.js が入れる window.game（デバッグ用の入口）と衝突する。
-->
<div id="app"></div>

<!--
  起動できなかったときの案内。src/main.js が最後まで走ったら消える。
  file:// で開くと ES Modules が読めず、CDN が届かないと Phaser が無い。
  どちらも画面が真っ黒になるだけなので、理由が分かるようにしておく。
-->
<div id="notice">
  <p><strong>Pentomino Puzzle を読み込めなかった</strong></p>
  <p>
    <code>file://</code> で開くと ES Modules が読めない。<br>
    ローカルサーバ経由で開くこと。
  </p>
  <p><code>python3 -m http.server 8765</code> → <code>http://localhost:8765/</code></p>
  <p>ネットワークが繋がらないときは、CDN の Phaser も届かない。</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
