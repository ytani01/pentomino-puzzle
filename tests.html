import {

// ---- ごく小さなテストの土台 ----------------------------------------------
// 依存を増やさないために自前で持つ。落ちた場所が分かればよいので、
// 例外のメッセージをそのまま出す。

const groups = [];
let current = null;

function group(title) {
  current = { title, cases: [] };
  groups.push(current);
}

function test(title, fn) {
  try {
    fn();
    current.cases.push({ title, ok: true, why: '' });
  } catch (error) {
    current.cases.push({ title, ok: false, why: error.message });
  }
}

function assert(condition, message) {
  if (!condition) throw new Error(message || '成り立たなかった');
}

function assertSame(actual, expected, message) {
  const a = JSON.stringify(actual);
  const b = JSON.stringify(expected);
  if (a !== b) throw new Error(`${message || ''} 期待 ${b} / 実際 ${a}`);
}

const NAMES = PIECES.map((piece) => piece.name);
const cellsOf = (name) => PIECES.find((piece) => piece.name === name).cells;

// ---- config -------------------------------------------------------------

group('src/config.js — ピースの定義');

test('ペントミノは 12 種で、名前が重なっていない', () => {
  assertSame(PIECES.length, 12, '種類の数');
  assertSame(new Set(NAMES).size, 12, '名前の異なり数');
  assertSame(NAMES.join(''), 'FILNPTUVWXYZ', '並び');
});

test('どのピースも 5 マスで、座標が重なっていない', () => {
  for (const piece of PIECES) {
    assertSame(piece.cells.length, PIECE_SIZE, `${piece.name} のマス数`);
    const keys = new Set(piece.cells.map(([r, c]) => `${r},${c}`));
    assertSame(keys.size, PIECE_SIZE, `${piece.name} の重複したマス`);
  }
});

test('どのピースも上下左右で繋がっている', () => {
  for (const piece of PIECES) {
    const keys = new Set(piece.cells.map(([r, c]) => `${r},${c}`));
    const seen = new Set([`${piece.cells[0][0]},${piece.cells[0][1]}`]);
    const stack = [piece.cells[0]];
    while (stack.length > 0) {
      const [r, c] = stack.pop();
      for (const [nr, nc] of [[r - 1, c], [r + 1, c], [r, c - 1], [r, c + 1]]) {
        const key = `${nr},${nc}`;
        if (keys.has(key) && !seen.has(key)) {
          seen.add(key);
          stack.push([nr, nc]);
        }
      }
    }
    assertSame(seen.size, PIECE_SIZE, `${piece.name} が途切れている`);
  }
});

test('12 種の色が重なっていない', () => {
  assertSame(new Set(PIECES.map((piece) => piece.color)).size, 12, '色の異なり数');
});

test('置けるマスの数はピース 12 種ぶんとちょうど同じ', () => {
  assertSame(PLAYABLE_CELLS, PIECES.length * PIECE_SIZE, '60 マス');
});

test('BOARDS は 8×8 と 6×10 を持ち、既定の盤がその中にある', () => {
  assertSame(Object.keys(BOARDS), ['8x8', '6x10'], '盤の並び');
  assert(BOARDS[DEFAULT_BOARD_KEY], `既定の盤 ${DEFAULT_BOARD_KEY} が BOARDS に無い`);
  for (const spec of Object.values(BOARDS)) {
    assertSame(spec.rows * spec.cols - (spec.hole ? spec.hole.rows * spec.hole.cols : 0),
      PLAYABLE_CELLS, `${spec.label} の置けるマス数`);
  }
});

test('PALETTES は必要な項目をそろえ、既定の組がその中にある', () => {
  assert(PALETTES[DEFAULT_PALETTE_KEY], `既定の組 ${DEFAULT_PALETTE_KEY} が PALETTES に無い`);
  for (const [key, palette] of Object.entries(PALETTES)) {
    assertSame(palette.key, key, 'キーと中身の key が食い違っている');
    assert(typeof palette.label === 'string' && palette.label !== '', `${key} の label`);
    // 単色なら色を 1 つ、色を分けるなら `null`（`PIECES[].color` を使う）。
    assert(palette.mono === null || Number.isInteger(palette.mono), `${key} の mono`);
    // ピースごとの色を持つなら、12 種すべてにある（欠けると undefined で塗られる）。
    if (palette.colors !== null) {
      for (const piece of PIECES) {
        assert(Number.isInteger(palette.colors[piece.name]), `${key} の colors.${piece.name}`);
      }
    }
    assert(palette.outlineDarken > 0 && palette.outlineDarken <= 1, `${key} の outlineDarken`);
    assert(palette.outlineWidth > 0, `${key} の outlineWidth`);
  }
});

group('src/config.js — トレイのスロット（makeLayout, TODO-053）');

for (const portrait of [false, true]) {
  for (const spec of Object.values(BOARDS)) {
    const label = `${portrait ? '縦' : '横'}画面・${spec.label}`;
    const { board, tray } = makeLayout({ portrait, board: spec });
    const longSide = (cells) => 1 + Math.max(...cells.map(([r]) => r), ...cells.map(([, c]) => c));

    test(`スロットが 12 個あり、どの 2 つも重ならない（${label}）`, () => {
      assertSame(tray.slots.length, PIECES.length, 'スロットの数');
      tray.slots.forEach((a, i) => tray.slots.slice(i + 1).forEach((b, k) => {
        const apart = Math.abs(a.x - b.x) >= (a.size + b.size) / 2
          || Math.abs(a.y - b.y) >= (a.size + b.size) / 2;
        assert(apart, `${PIECES[i].name} と ${PIECES[i + 1 + k].name} が重なる`);
      }));
    });

    test(`どのスロットもトレイに収まる（${label}）`, () => {
      tray.slots.forEach((s, i) => {
        const inside = s.x - s.size / 2 >= tray.x && s.x + s.size / 2 <= tray.x + tray.width
          && s.y - s.size / 2 >= tray.y && s.y + s.size / 2 <= tray.y + tray.height;
        assert(inside, `${PIECES[i].name} がトレイからはみ出す`);
      });
    });

    test(`どのスロットもピースの長い辺ぶんの一辺がある（${label}）`, () => {
      tray.slots.forEach((s, i) => {
        assert(s.size >= longSide(PIECES[i].cells) * tray.cell, `${PIECES[i].name} のスロットが狭い`);
      });
    });

    test(`スロットは盤の側の端から詰めてある（${label}）`, () => {
      // 盤から離れる向き（横画面は右、縦画面は下）に、どこまで広がるか。
      const near = (sl) => (portrait ? sl.y : sl.x) - sl.size / 2;
      const far = (sl) => (portrait ? sl.y : sl.x) + sl.size / 2;
      const start = portrait ? tray.y : tray.x;
      assertSame(Math.min(...tray.slots.map(near)), start, '盤に一番近いスロットの端');
      const largest = Math.max(...tray.slots.map((sl) => sl.size));
      assert(Math.max(...tray.slots.map(far)) - start <= largest * 3, '盤から離れすぎている');
    });

    test(`盤とトレイが重ならない（${label}）`, () => {
      const apart = board.x + spec.cols * board.cell <= tray.x
        || board.y + spec.rows * board.cell <= tray.y;
      assert(apart, '盤とトレイが重なる');
    });
  }
}

group('src/config.js — HUD のボタンの並び（makeLayout, TODO-076）');

for (const portrait of [false, true]) {

group('src/logic.js — 向きの生成');

test('normalize は左上へ寄せ、行優先に並べ替える', () => {
  assertSame(normalize([[3, 5], [2, 6], [2, 5]]), [[0, 0], [0, 1], [1, 0]]);
});

test('rotateCw は L を横向きにする', () => {
  assertSame(rotateCw(cellsOf('L')), [[0, 0], [0, 1], [0, 2], [0, 3], [1, 0]]);
});

test('rotateCw を 4 回で元の向きに戻る', () => {
  for (const piece of PIECES) {
    const start = normalize(piece.cells);
    let turned = start;
    for (let i = 0; i < 4; i += 1) turned = rotateCw(turned);
    assert(sameShape(turned, start), `${piece.name} が戻らない`);
  }
});

test('flip を 2 回で元の向きに戻る', () => {
  for (const piece of PIECES) {
    const start = normalize(piece.cells);
    assert(sameShape(flip(flip(start)), start), `${piece.name} が戻らない`);
  }
});

test('向きの数は X が 1、I が 2、T・U・V・W・Z が 4、残りが 8', () => {
  const expected = {
    F: 8, I: 2, L: 8, N: 8, P: 8, T: 4, U: 4, V: 4, W: 4, X: 1, Y: 8, Z: 4,
  };
  const actual = {};
  for (const piece of PIECES) actual[piece.name] = orientations(piece.cells).length;
  assertSame(actual, expected);
});

test('12 種を合わせた向きは 63 通り', () => {
  const total = PIECES.reduce((sum, piece) => sum + orientations(piece.cells).length, 0);
  assertSame(total, 63);
});

test('同じ向きが 2 つ出てこない', () => {
  for (const piece of PIECES) {
    const list = orientations(piece.cells);
    for (let i = 0; i < list.length; i += 1) {
      for (let j = i + 1; j < list.length; j += 1) {
        assert(!sameShape(list[i], list[j]), `${piece.name} に同じ向きが 2 つある`);
      }
    }
  }
});

test('turnOrder は orientations と同じ向きを、重複なく並べる', () => {
  for (const piece of PIECES) {
    const order = turnOrder(piece.cells);
    const known = orientations(piece.cells);
    assertSame(order.length, known.length, `${piece.name} の数が違う`);
    for (const shape of order) {
      assert(known.some((one) => sameShape(one, shape)), `${piece.name} に知らない向き`);
    }
    for (let i = 0; i < order.length; i += 1) {
      for (let j = i + 1; j < order.length; j += 1) {
        assert(!sameShape(order[i], order[j]), `${piece.name} に同じ向きが 2 つある`);
      }
    }
  }
});

test('turnOrder の隣どうしは、90° 回転かその場の裏返しで移れる', () => {
  for (const piece of PIECES) {
    // 起点を渡さないとき（既定の baseTurn）と、定義の向きを渡したときの両方。
    for (const order of [turnOrder(piece.cells), turnOrder(piece.cells, piece.cells)]) {
      if (order.length < 2) continue;   // X は 1 通りしかないので巡りようがない
      for (let i = 0; i < order.length; i += 1) {
        const from = order[i];
        const to = order[(i + 1) % order.length];
        const ok = sameShape(to, rotateCw(from)) || sameShape(to, flip(from));
        assert(ok, `${piece.name} の ${i} 番目から次へ飛んでいる`);
      }
    }
  }
});

test('turnOrder は、渡した起点から並べる（TODO-025）', () => {
  for (const piece of PIECES) {
    const start = normalize(piece.cells);
    const order = turnOrder(piece.cells, piece.cells);
    assertSame(order[0], start, `${piece.name} の先頭が起点でない`);
    // 起点を変えても、並ぶ向きの集合と数は変わらない。
    assertSame(order.length, orientations(piece.cells).length, `${piece.name} の数が違う`);
  }
});

test('turnOrder は、定義の向きを起点にすると裏返しの位置が揃う（TODO-025）', () => {
  for (const piece of PIECES) {
    const order = turnOrder(piece.cells, piece.cells);
    if (order.length < 2) continue;   // X は 1 通りしかないので、回転も裏返しも同じ
    const start = normalize(piece.cells);
    // i 番目から次へ移るときが、その場の裏返しかどうか。V のように回転でも
    // 裏返しでも同じ向きになる遷移があるので、回転で説明できるものは回転と見る。
    const flips = order.map((from, i) => {
      const to = order[(i + 1) % order.length];
      return !sameShape(to, rotateCw(from)) && sameShape(to, flip(from));
    });
    // 裏返しても回転で重なるピース（I・T・U・V・W）は、裏返しが並びに出ない。
    // それ以外は、表を回り切ってから裏返るので、並びの半分の位置と最後だけ。
    const rotations = [];
    let turned = start;
    for (let i = 0; i < 4; i += 1) { rotations.push(turned); turned = rotateCw(turned); }
    const sameWhenFlipped = rotations.some((shape) => sameShape(shape, flip(start)));
    const half = order.length / 2;
    const expected = order.map((_, i) => !sameWhenFlipped
      && (i === half - 1 || i === order.length - 1));
    assertSame(flips, expected, `${piece.name} の裏返しの位置`);
  }
});

test('nextTurn を向きの数だけ繰り返すと元へ戻り、途中で全部を通る', () => {
  for (const piece of PIECES) {
    const start = normalize(piece.cells);
    const seen = [];
    let current = start;
    for (let i = 0; i < orientations(piece.cells).length; i += 1) {
      seen.push(current);
      current = nextTurn(current);
    }
    assert(sameShape(current, start), `${piece.name} が戻らない`);
    for (const shape of orientations(piece.cells)) {
      assert(seen.some((one) => sameShape(one, shape)), `${piece.name} に通らない向き`);
    }
  }
});

test('X は nextTurn でも向きが変わらない', () => {
  const start = normalize(cellsOf('X'));
  assert(sameShape(nextTurn(start), start), 'X の向きが変わった');
});

test('prevTurn は nextTurn の逆順（TODO-069）', () => {
  for (const piece of PIECES) {
    const start = normalize(piece.cells);
    const next = nextTurn(start, piece.cells);
    const back = prevTurn(next, piece.cells);
    assert(sameShape(back, start), `${piece.name} が prevTurn で戻らない`);
  }
});

test('X は prevTurn でも向きが変わらない（TODO-069）', () => {
  const start = normalize(cellsOf('X'));
  assert(sameShape(prevTurn(start), start), 'X の向きが変わった');
});

test('turnPivot は、右回り・左回り・裏返しのどれでも、マス全部の中心をちょうど新しい形のマスへ移す（TODO-069）', () => {
  // つかむ点はマスの真ん中（`turnDrag()` が実際に扱うのも、マスの中の
  // 連続した点。マスのラベルそのもの＝角は隣のマスとの境目で、
  // どちらのマスに属すか決まらないので確かめない）。
  // 5 マスの移った先が、新しい形の 5 マスとちょうど 1 対 1 で重なるかを見る
  // （どれか 1 マスだけ合っていても、他がずれていれば見逃さない）。
  for (const piece of PIECES) {
    const start = normalize(piece.cells);
    for (const target of [rotateCw(start), rotateCcw(start), flip(start)]) {
      if (sameShape(target, start)) continue; // X など、向きが変わらないものは確かめない
      const mapped = start.map(([row, col]) => {
        const [r, c] = turnPivot(start, target, [row + 0.5, col + 0.5]);
        return `${Math.floor(r)},${Math.floor(c)}`;
      }).sort().join('|');
      const expected = target.map(([r, c]) => `${r},${c}`).sort().join('|');
      assertSame(mapped, expected, `${piece.name} が新しい形とちょうど重ならない`);
    }
  }
});

test('turnPivot は行き来しても元の点へ戻る（TODO-069）', () => {
  for (const piece of PIECES) {
    const start = normalize(piece.cells);
    const next = nextTurn(start, piece.cells);
    if (sameShape(next, start)) continue; // X
    for (const cellPoint of start) {
      const moved = turnPivot(start, next, cellPoint);
      const back = turnPivot(next, start, moved);
      assertSame(back, cellPoint, `${piece.name} の点が往復で戻らない`);
    }
  }
});

test('orientationSteps は同じ向きなら空を返す（TODO-065）', () => {
  const start = normalize(cellsOf('F'));
  assertSame(orientationSteps(start, start), []);
});

test('orientationSteps は 1 回転だけの道を返す（TODO-065）', () => {
  const start = normalize(cellsOf('F'));
  const target = rotateCw(start);
  const steps = orientationSteps(start, target);
  assertSame(steps.length, 1, '段数');
  assertSame(steps[0].kind, 'rotate');
  assert(sameShape(steps[0].cells, target), '最後の形');
});

test('orientationSteps は裏返しだけの道を返す（TODO-065）', () => {
  const start = normalize(cellsOf('F'));
  const target = flip(start);
  const steps = orientationSteps(start, target);
  assertSame(steps.length, 1, '段数');
  assertSame(steps[0].kind, 'flip');
  assert(sameShape(steps[0].cells, target), '最後の形');
});

test('orientationSteps は裏返し＋回転 2 回の道を返す（TODO-065）', () => {
  const start = normalize(cellsOf('F'));
  const target = rotateCw(rotateCw(flip(start)));
  const steps = orientationSteps(start, target);
  assertSame(steps.length, 3, '段数');
  assertSame(steps.filter((step) => step.kind === 'flip').length, 1, '裏返しの回数');
  assertSame(steps.filter((step) => step.kind === 'rotate').length, 2, '回転の回数');
  assert(sameShape(steps[steps.length - 1].cells, target), '最後の形');
});

test('orientationSteps は X なら常に空を返す（TODO-065）', () => {
  const start = normalize(cellsOf('X'));
  assertSame(orientationSteps(start, start), []);
  assertSame(orientationSteps(start, rotateCw(start)), []);
  assertSame(orientationSteps(start, flip(start)), []);
});

test('orientationSteps は回転してから裏返す 2 段の道も返す（TODO-065）', () => {
  const start = normalize(cellsOf('F'));
  const target = flip(rotateCw(start));
  const steps = orientationSteps(start, target);
  assertSame(steps.length, 2, '段数');
  assert(sameShape(steps[steps.length - 1].cells, target), '最後の形');
});

/**
 * `orientationSteps()` とは別の道筋で最短段数を数える（レビューの要修正 2）。
 * 深さごとに届く形を総当たりで広げるだけで、`orientationSteps()` の幅優先探索
 * （キュー・訪問済みの管理）を一切共有しないので、あちら側の実装に潜むバグ
 * （深さ優先に化ける、右回りだけで探す、など）を捕まえられる。
 */
function orientationDistance(from, to) {
  const start = normalize(from);
  const target = normalize(to);
  if (sameShape(start, target)) return 0;
  let frontier = [start];
  for (let depth = 1; depth <= 3; depth += 1) {
    const next = [];
    for (const cells of frontier) {
      for (const g of [rotateCw, rotateCcw, flip]) {
        const shape = g(cells);
        if (sameShape(shape, target)) return depth;
        next.push(shape);
      }
    }
    frontier = next;
  }
  return -1; // 3 段以内で届かなかった（利用者と決めた上限を超える。起きないはず）。
}

test('orientationSteps は全ピース・全向きの組で最短になる（TODO-065）', () => {
  for (const piece of PIECES) {
    const shapes = orientations(piece.cells);
    for (const from of shapes) {
      for (const to of shapes) {
        const steps = orientationSteps(from, to);
        const distance = orientationDistance(from, to);
        assertSame(steps.length, distance, `${piece.name} の段数が最短でない`);
        assert(steps.length <= 3, `${piece.name} が裏返し 1 回＋回転 2 回を超えた`);
        let prev = normalize(from);
        steps.forEach((step, i) => {
          const byRotate = step.kind === 'rotate'
            && (sameShape(step.cells, rotateCw(prev)) || sameShape(step.cells, rotateCcw(prev)));
          const byFlip = step.kind === 'flip' && sameShape(step.cells, flip(prev));
          assert(byRotate || byFlip, `${piece.name} の ${i} 段目が前の段から移れない`);
          prev = step.cells;
        });
        assert(sameShape(prev, normalize(to)), `${piece.name} の最後が目標でない`);
      }
    }
  }
});

// ---- logic：盤面 ---------------------------------------------------------
//
// createBoard / boardCells / canPlace / place / remove / isSolved /
// regionsFitPieces は盤の spec を受け取るので、8×8 と 6×10 の両方で
// ループして回す（TODO-009）。
//
// 「実際の解 1 つ」は求解して作るのをやめ、**データの 1 行目**から組み立てる
// （TODO-022）。盤面グループ・データのグループ・照合のグループで使うので、
// 先にまとめて作っておく。

const BOARD_LIST = Object.values(BOARDS);

/** 盤ごとの全解のデータ。動的 import と違って、テストでは両方まとめて読む。 */
const DATA = { '8x8': SOLUTIONS_8X8, '6x10': SOLUTIONS_6X10 };

/** 文献にある「本質的に異なる解」の数。データが合っているかの拠りどころ。 */
const KNOWN_COUNTS = { '8x8': { all: 520, canonical: 65 }, '6x10': { all: 9356, canonical: 2339 } };

/** 解の文字列を、12 個ぶんの置き方（`{ name, cells, row, col }`）へ分解する。 */
function placementsOf(spec, cells) {
  return NAMES.map((name) => placementIn(cells, spec.cols, name));
}

/** 解の文字列から盤面を組み立てる。1 手ずつ `place()` を通すので置き方の検証も兼ねる。 */
function boardOf(spec, cells) {
  return placementsOf(spec, cells)
    .reduce((acc, p) => place(acc, p.name, p.cells, p.row, p.col), createBoard(spec));
}

const boardStates = BOARD_LIST.map((spec) => {
  const emptyBoard = createBoard(spec);
  const canonical = DATA[spec.key];
  return {
    spec,
    emptyBoard,
    canonical,
    solutions: buildSolutions(spec, canonical),
    placements: placementsOf(spec, canonical[0]),
    solved: boardOf(spec, canonical[0]),
  };
});

// ---- logic：forcedPlacements（TODO-044）----------------------------------
//
// 解 1 つ（boardStates の solved）からピースを取り除き、その空きが
// 残りのピースのどれかとしか埋まらないことを確かめる。

group('src/logic.js — forcedPlacements');

/** a と b が盤の中で辺を接しているか（隣り合う 2 つを取り除いたときの判定用）。 */
function touchesInBoard(board, spec, a, b) {
  return board.grid.some((value, i) => value === a && (
    (i % spec.cols > 0 && board.grid[i - 1] === b)
    || (i % spec.cols < spec.cols - 1 && board.grid[i + 1] === b)
    || board.grid[i - spec.cols] === b
    || board.grid[i + spec.cols] === b));
}

/** 縦 5 マスの空きを 2 か所（列を空けて隔てる）だけ持つ盤。同じピースが 2 度当たる形を作る。 */
function dupHoleBoard(spec) {
  const grid = new Array(spec.rows * spec.cols).fill(HOLE);
  for (const col of [0, 2]) {
    for (let row = 0; row < PIECE_SIZE; row += 1) grid[row * spec.cols + col] = null;
  }
  return { rows: spec.rows, cols: spec.cols, grid };
}

for (const state of boardStates) {
  const { spec, emptyBoard, solved } = state;

  test(`取り除いた 1 つのピースだけを返し、置き直すと元の盤に戻る（${spec.label}）`, () => {
    for (const name of NAMES) {
      const board = remove(solved, name);
      const got = forcedPlacements(board, NAMES);
      assertSame(got.length, 1, `${name} を取り除いたのに ${got.length} 件返した`);
      assertSame(got[0].name, name, `${name} ではなく ${got[0].name} を返した`);
      const after = place(board, got[0].name, got[0].cells, got[0].row, got[0].col);
      assertSame(boardKey(after), boardKey(solved), `${name} を置き直しても元の盤に戻らない`);
    }
  });

  test(`names に無いピースの形の空きは返さない（${spec.label}）`, () => {
    for (const name of NAMES) {
      const board = remove(solved, name);
      assertSame(forcedPlacements(board, NAMES.filter((n) => n !== name)).length, 0,
        `${name} を names から外したのに返した`);
    }
  });

  test(`隣り合わない 2 つを取り除くと両方返し、隣り合う 2 つは何も返さない（${spec.label}）`, () => {
    for (let i = 0; i < NAMES.length; i += 1) {
      for (let j = i + 1; j < NAMES.length; j += 1) {
        const a = NAMES[i];
        const b = NAMES[j];
        const board = remove(remove(solved, a), b);
        const got = forcedPlacements(board, NAMES);
        if (touchesInBoard(solved, spec, a, b)) {
          assertSame(got.length, 0, `${a}/${b} は隣り合うのに返した`);
        } else {

/** テスト用の擬似乱数（mulberry32）。シードを固定すれば手順が再現できる。 */
function mulberry32(seed) {
  let a = seed >>> 0;
  return () => {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/**
 * 最初の解が見つかるまでの手を集めて返す。手数が上限を超えたら探索が
 * 壊れているとみなして打ち切る（無限ループでテストごと固まらないため）。
 */
function firstSolutionSteps(spec, random, limit = 1000000) {
  const steps = [];
  for (const step of solveSteps(spec, random)) {
    steps.push(step);
    if (step.type === 'solved') return steps;
    if (steps.length > limit) throw new Error('手数の上限を超えた');
  }
  throw new Error('解に至らずに探索が終わった');
}

// 事前に探して選んだ、最初の解までの手数が少なく済むシード。どちらも
// 途中で枝刈り（regionsFitPieces が偽になって置き方を捨てる）が起きる
// もの（8×8 の seed 14 は 107 手のうち 31 回、6×10 の seed 164 は
// 25 手のうち 5 回）を選んである。
const FAST_SEED = { '8x8': 14, '6x10': 164 };
// 手順が違うことを確かめるための、別のシード。
const OTHER_SEED = { '8x8': 1, '6x10': 1 };

for (const spec of BOARD_LIST) {
  test(`最初の解までの place/remove を空の盤へ当てはめると完成する（${spec.label}）`, () => {
    const steps = firstSolutionSteps(spec, mulberry32(FAST_SEED[spec.key]));
    let board = createBoard(spec);
    for (const step of steps) {
      if (step.type === 'place') board = place(board, step.name, step.cells, step.row, step.col);
      else if (step.type === 'remove') board = remove(board, step.name);
    }
    assert(isSolved(board), '完成していない');
    assertSame(placedNames(board).sort(), NAMES, '12 種すべてが揃っていない');
  });

  test(`place は常に置ける位置で出て、remove は盤にあるピースだけを外す（${spec.label}）`, () => {
    const steps = firstSolutionSteps(spec, mulberry32(FAST_SEED[spec.key]));
    let board = createBoard(spec);
    for (const step of steps) {
      if (step.type === 'place') {
        assert(canPlace(board, step.cells, step.row, step.col).ok,
          `${step.name} を置けない位置で place が出た`);
        board = place(board, step.name, step.cells, step.row, step.col);
      } else if (step.type === 'remove') {
        assert(placedNames(board).includes(step.name),
          `${step.name} は盤に無いのに remove が出た`);
        board = remove(board, step.name);
      }
    }
  });

  test(`枝刈りで捨てた置き方も、直後に同じピースの remove として出る（${spec.label}）`, () => {
    // place を当てて regionsFitPieces が偽になったら枝刈りの対象。そこで
    // 打ち切って次の候補へ進むのではなく、いったん置いたものとして扱い
    // 直後に remove で戻す（試して捨てる様子を見せるため）。ここが place・
    // remove ごと丸ごと飛ばされていないかを確かめる（枝刈りの分岐そのものは
    // 通っていても、捕まえられなければ意味が無い）。
    const steps = firstSolutionSteps(spec, mulberry32(FAST_SEED[spec.key]));
    let board = createBoard(spec);
    let pruneCount = 0;
    for (let i = 0; i < steps.length; i += 1) {
      const step = steps[i];
      if (step.type === 'place') {
        board = place(board, step.name, step.cells, step.row, step.col);
        if (!regionsFitPieces(board)) {
          pruneCount += 1;
          const next = steps[i + 1];
          assert(next && next.type === 'remove' && next.name === step.name,
            `${step.name} を置いて枝刈りになったのに、次が同じピースの remove でない`);
        }
      } else if (step.type === 'remove') {
        board = remove(board, step.name);
      }
    }
    assert(pruneCount > 0, '選んだシードで枝刈りが一度も起きなかった（シードを選び直すこと）');
  });

  test(`place の cells は orientations() のどれかと同じ形（${spec.label}）`, () => {
    const steps = firstSolutionSteps(spec, mulberry32(FAST_SEED[spec.key]));
    for (const step of steps) {
      if (step.type !== 'place') continue;
      const shapes = orientations(cellsOf(step.name));
      assert(shapes.some((shape) => sameShape(shape, step.cells)),
        `${step.name} の cells がどの向きとも一致しない`);
    }
  });

  test(`同じシードなら 2 回回しても手順がまったく同じ（${spec.label}）`, () => {
    const a = firstSolutionSteps(spec, mulberry32(FAST_SEED[spec.key]));
    const b = firstSolutionSteps(spec, mulberry32(FAST_SEED[spec.key]));
    assertSame(a, b);
  });

  test(`違うシードなら最初の解か手順のどちらかが違う（${spec.label}）`, () => {
    const a = firstSolutionSteps(spec, mulberry32(FAST_SEED[spec.key]));
    const b = firstSolutionSteps(spec, mulberry32(OTHER_SEED[spec.key]));
    assert(JSON.stringify(a) !== JSON.stringify(b), '違うシードなのに手順が一致した');
  });

  test(`solved のあとも next() を続けると、別の盤面の 2 番目の解に至る（${spec.label}）`, () => {
    const iterator = solveSteps(spec, mulberry32(FAST_SEED[spec.key]));
    let board = createBoard(spec);
    let firstSolvedGrid = null;
    let solvedCount = 0;
    let taken = 0;
    let result;
    while (!(result = iterator.next()).done) {
      const step = result.value;
      taken += 1;
      if (taken > 1000000) throw new Error('手数の上限を超えた');
      if (step.type === 'place') board = place(board, step.name, step.cells, step.row, step.col);
      else if (step.type === 'remove') board = remove(board, step.name);
      else if (step.type === 'solved') {
        solvedCount += 1;
        assert(isSolved(board), `${solvedCount} 番目の解で完成していない`);
        if (solvedCount === 1) firstSolvedGrid = board.grid.slice();
        if (solvedCount === 2) break;
      }
    }
    assertSame(solvedCount, 2, '2 番目の解に至らなかった');
    assert(JSON.stringify(board.grid) !== JSON.stringify(firstSolvedGrid), '1 番目と同じ盤面だった');
  });
}

}

// ---- logic：ランダムの探索（solveStepsRandom, TODO-057）--------------------
//
// 解に着くことは確かめない（永遠に解に着かなくてよいと決めてある）。
// 最初の数百〜数千手だけを集めて、手順の再現性と、place/remove の整合を見る。

/** solveStepsRandom を limit 手までまとめて集める（全部は待たない）。 */
function randomSteps(spec, random, canContinue, limit) {
  const steps = [];
  for (const step of solveStepsRandom(spec, random, canContinue)) {
    steps.push(step);
    if (steps.length >= limit) break;
  }
  return steps;
}

/** 5 の倍数でない（ピースで埋め切れない）閉じた空きが盤にあるか（TODO-060・068）。 */
function hasUnfitClosedRegion(board) {
  return !regionsFitPieces(board);
}

/**
 * 盤に置き済みのピースと同じ形の 5 マスの閉じた空きがあるか（TODO-067）。
 * ピースは 1 種 1 つなので、この形の空きはもう埋められない。
 */
function hasPlacedFormClosedRegion(board) {
  return forcedPlacements(board, placedNames(board)).length > 0;
}

/**
 * 残りのどのピースの置き方でも覆えない空きマスが盤にあるか（TODO-077）。
 * 置き済みのピースと同じ形の 5 マスの空き（`hasPlacedFormClosedRegion`）も
 * 覆えないマスを含むので、これに含まれる。
 */
function hasUncoverableCellOnBoard(board) {
  const unused = NAMES.filter((name) => !placedNames(board).includes(name));
  return hasUncoverableCell(board, unused);
}

/**
 * place の直前の盤面 `board` で、この place が `forcedPlacements()`（TODO-044）の
 * 候補のどれかと一致するか（TODO-066）。一致すれば、`solveStepsRandom()` は
 * 抽選より先にこれを選んでいる。
 */
function isForcedFillStep(board, step) {
  const unused = NAMES.filter((name) => !placedNames(board).includes(name));
  return forcedPlacements(board, unused).some((found) => found.name === step.name
    && found.row === step.row && found.col === step.col && sameShape(found.cells, step.cells));
}

/**
 * `canContinue` を、直前の呼び出しからの変化が「forced な手を 1 つ置いた」ことなら
 * 偽を返すように作る（TODO-066 の「埋めた直後に解なしなら…」を狙って起こすため）。
 * `solveStepsRandom()` は `place`・`remove` の直後に毎回 `canContinue(board)` を
 * 呼ぶので、前回呼ばれたときの盤面との差分だけで判定できる。
 */
function makeFailAfterForcedFill() {
  let prevSnapshot = null;
  return (board) => {
    const snapshot = { rows: board.rows, cols: board.cols, grid: board.grid.slice() };
    let forced = false;
    if (prevSnapshot) {
      const prevNames = placedNames(prevSnapshot);
      const nowNames = placedNames(snapshot);
      if (nowNames.length === prevNames.length + 1) {
        const addedName = nowNames.find((name) => !prevNames.includes(name));
        const unusedBefore = NAMES.filter((name) => !prevNames.includes(name));
        forced = forcedPlacements(prevSnapshot, unusedBefore).some((found) => found.name === addedName);
      }
    }
    prevSnapshot = snapshot;
    return forced ? false : regionsFitPieces(board);
  };
}

for (const spec of BOARD_LIST) {
  const solutionsForSpec = boardStates.find((state) => state.spec.key === spec.key).solutions;

  test(`同じシードなら最初の 300 手がまったく同じ、違うシードなら食い違う（${spec.label}）`, () => {
    const a = randomSteps(spec, mulberry32(FAST_SEED[spec.key]), regionsFitPieces, 300);
    const b = randomSteps(spec, mulberry32(FAST_SEED[spec.key]), regionsFitPieces, 300);
    assertSame(a, b, '同じシードなのに手順が食い違う');

    const c = randomSteps(spec, mulberry32(OTHER_SEED[spec.key]), regionsFitPieces, 300);
    assert(JSON.stringify(a) !== JSON.stringify(c), '違うシードなのに手順が一致した');
  });

  for (const [label, canContinue] of [['既定', regionsFitPieces], ['常に偽', () => false]]) {
    test(`place は空いたマスにだけ置かれ、remove は盤にあるピースだけを外す（${label}, ${spec.label}）`, () => {
      const steps = randomSteps(spec, mulberry32(FAST_SEED[spec.key]), canContinue, 2000);
      let board = createBoard(spec);
      for (const step of steps) {
        if (step.type === 'place') {
          assert(canPlace(board, step.cells, step.row, step.col).ok,
            `${step.name} を置けない位置で place が出た`);
          board = place(board, step.name, step.cells, step.row, step.col);
        } else if (step.type === 'remove') {
          assert(placedNames(board).includes(step.name),
            `${step.name} は盤に無いのに remove が出た`);
          board = remove(board, step.name);
        }
      }
    });

    test(`ok は渡した判定の結果と一致する。remove の ok も外した後の盤面の判定と一致する（${label}, ${spec.label}）`, () => {
      const steps = randomSteps(spec, mulberry32(FAST_SEED[spec.key]), canContinue, 2000);
      let board = createBoard(spec);
      let checked = 0;
      for (const step of steps) {
        if (step.type === 'place') {
          board = place(board, step.name, step.cells, step.row, step.col);
          assertSame(step.ok, canContinue(board), `${step.name} の place で ok が食い違う`);
          checked += 1;
        } else if (step.type === 'remove') {
          board = remove(board, step.name);
          assertSame(step.ok, canContinue(board), `${step.name} の remove で ok が食い違う`);
        }
      }
      assert(checked > 0, 'place が 1 度も出なかった（limit を見直すこと）');
    });

    test(`置ける手が尽きて 1 手ずつ外す並び（remove の連なり）は、最後の 1 手だけが ok:true か盤が空になっており、途中の remove は ok:false（5 の倍数でない空きで即座に外れる 1 手は除く。${label}, ${spec.label}）`, () => {
      // 1 回の while ループ（1 つの連なり）の終わりは ok:true か盤が空のどちらか。
      // ok:true で終わった直後でも、外へ出た先でまた置ける手が無ければ、
      // place を挟まずに次の連なりがすぐ始まる。そのため「次が place かどうか」
      // では連なりの区切りを判定できず、1 手ずつ ok と盤の状態で区切る。
      // 置いた直後に 5 の倍数でない閉じた空きができたときの remove は、置ける手が
      // 尽きた連なりとは別物（ok の真偽に関わらずその場で 1 手だけ外れる。TODO-060・068）。
      // 既定（regionsFitPieces）の判定は、ok:false の place がその場で必ず
      // 外れてしまい、「ok:false の remove が続いたあと ok:true で止まる」
      // という連なりの中身の流れが起きない（reviewer 報告 TODO-068 の指摘 2）。
      // その流れを起こすため、既定の分だけ regionsFitPieces より厳しい
      // hasSolution（実際の解と照合する）を使う。
      const effectiveCanContinue = label === '既定'
        ? (board) => hasSolution(solutionsForSpec, board)
        : canContinue;
      // 6×10・既定は、singlePieceCell（TODO-082）で置き済みピースの形の空きへ
      // 向かう手が減り、FAST_SEED だと解に着くまでに一度も起きない。置き済み
      // ピースの形の空きが 3000 手以内に起きる別の種（4）に替える
      // （このテストだけのローカルな種。FAST_SEED は他のテストと共有のため変えない）。
      const seed = (label === '既定' && spec.key === '6x10') ? 4 : FAST_SEED[spec.key];
      // 常に偽だと DEMO.randomDeadLimit 手置くたびに盤が空まで戻り、置き済みピースの
      // 形の空きができるほど深く進まない。ここで見たいのはその場で外す手なので、
      // 上限を外して走らせる（上限そのものは TODO-081 のテストで確かめる）。
      const savedDeadLimit = DEMO.randomDeadLimit;
      let steps;
      try {
        if (label === '常に偽') DEMO.randomDeadLimit = Infinity;
        steps = randomSteps(spec, mulberry32(seed), effectiveCanContinue, 3000);
      } finally {
        DEMO.randomDeadLimit = savedDeadLimit;
      }
      let board = createBoard(spec);
      let sawRun = false;
      let sawForcedDoubleUndo = false;
      let sawUnfitRegionUndo = false;
      let sawPlacedFormUndo = false;
      let sawUncoverableRegionUndo = false;
      let i = 0;
      while (i < steps.length) {
        const step = steps[i];
        // hasSolution（既定の代わり）は実際の解へ向かうので、limit の手前で
        // 本当に完成することがある。完成は連なりでも置き方でもないので、
        // そこで打ち切る（TODO-068・reviewer 報告の指摘 2 で既定に導入）。
        if (step.type === 'solved') break;
        if (step.type === 'place') {
          const boardBeforePlace = board;
          board = place(board, step.name, step.cells, step.row, step.col);
          // forced な place が解なしだったときは、その手と直前の手をまとめて
          // 外す（TODO-066）。5 の倍数でない空き・置き済みピースの形の空きの
          // 即座の remove とは排他（else if）。
          const forcedFail = step.ok === false && isForcedFillStep(boardBeforePlace, step);
          const unfitRegion = !forcedFail && hasUnfitClosedRegion(board);
          // 残りのどのピースでも覆えない空きマスも、行き詰まりを待たずに
          // その場で 1 手だけ外れる（TODO-077）。5 の倍数でない空きの即座の
          // remove とは排他（else if）。置き済みのピースと同じ形の 5 マスの
          // 空き（TODO-067）もここに含まれる。
          const uncoverableRegion = !forcedFail && !unfitRegion && hasUncoverableCellOnBoard(board);
          const placedFormRegion = !forcedFail && !unfitRegion && hasPlacedFormClosedRegion(board);
          if (placedFormRegion) {
            assert(uncoverableRegion,
              `${step.name} を置いて置き済みピースの形の空きができたのに、覆えないマスとして見ていない`);
          }
          i += 1;
          if (forcedFail) {
            if (i >= steps.length) break; // limit で打ち切った末尾。次の手は分からない
            assert(steps[i] && steps[i].type === 'remove' && steps[i].name === step.name,
              `${step.name} の forced な place が解なしなのに、直後が同じ名前の remove でない`);
            board = remove(board, steps[i].name);
            i += 1;
            if (placedNames(board).length > 0) {
              if (i >= steps.length) break;
              assert(steps[i] && steps[i].type === 'remove',
                `${step.name} を forced で外した直後、盤にまだ手があるのに次が remove でない`);
              board = remove(board, steps[i].name);
              i += 1;
            }
            sawForcedDoubleUndo = true; // 置ける手が尽きた連なりとは別物なので sawRun には数えない
          } else if (unfitRegion || uncoverableRegion) {
            if (i >= steps.length) break; // limit で打ち切った末尾。次の手は分からない
            const reason = unfitRegion ? '5 の倍数でない空き'
              : placedFormRegion ? '置き済みピースの形の空き' : '覆えない空きマス';
            assert(steps[i] && steps[i].type === 'remove' && steps[i].name === step.name,
              `${step.name} を置いて${reason}ができたのに、次が同じ名前の remove でない`);
            board = remove(board, steps[i].name);
            i += 1;
            if (unfitRegion) {
              sawUnfitRegionUndo = true; // 置ける手が尽きた連なりとは別物なので sawRun には数えない
            } else {
              sawUncoverableRegionUndo = true;
              if (placedFormRegion) sawPlacedFormUndo = true;
            }
          }
          continue;
        }
        // 1 つの連なりの始まり。ok:true か盤が空になるまで 1 手ずつ確かめる。
        for (;;) {
          board = remove(board, steps[i].name);
          const isRunEnd = steps[i].ok || placedNames(board).length === 0;
          i += 1;
          if (isRunEnd) { sawRun = true; break; }
          assertSame(steps[i - 1].ok, false, `連なりの途中の ${steps[i - 1].name} の remove の ok が false でない`);
          if (i >= steps.length) break; // limit で打ち切った末尾。連なりが本当に終わったかは分からない
          assert(steps[i] && steps[i].type === 'remove',
            `${steps[i - 1].name} の remove（ok:false、盤に残りあり）の直後が remove でない`);
        }
      }
      assert(sawRun, '選んだシード・手数で remove の連なりが一度も終わらなかった');
      assert(sawUnfitRegionUndo, '選んだシード・手数で 5 の倍数でない空きによる即座の remove が一度も起きなかった');
      // forced な解なしの二重 remove の確認は、確実に起こす専用のテスト
      // （makeFailAfterForcedFill() を使うもの）に任せる。
      assert(sawPlacedFormUndo, '選んだシード・手数で置き済みピースの形の空きによる即座の remove が一度も起きなかった');
      assert(sawUncoverableRegionUndo, '選んだシード・手数で覆えない空きマスによる即座の remove が一度も起きなかった');
    });
  }

  test(`常に偽を返す判定だと、戻るたびに（置ける手が尽きるか DEMO.randomDeadLimit に達するか）、盤のピースがすべて外れるまで remove が続く（5 の倍数でない空きで即座に外れる 1 手は除く。${spec.label}）`, () => {
    // canContinue が常に偽なので、置ける手が尽きたときの remove の while ループは
    // 一度も ok:true で break せず、stack が空になるまで（＝盤のピースが
    // すべて外れるまで）続く。ただし、置いた直後に 5 の倍数でない閉じた空きが
    // できてその場で 1 手だけ外れる場合は、置ける手が尽きたことによる連なりでは
    // ないので、盤が空になっている必要は無い（TODO-060・068）。
    const steps = randomSteps(spec, mulberry32(FAST_SEED[spec.key]), () => false, 3000);
    let board = createBoard(spec);
    let sawRemoveRun = false;
    // 5 の倍数でない空き・覆えない空きマス（置き済みピースの形の空きを含む）の
    // 即座の remove（1 手）と、forced な解なしの二重 remove（2 手）を、次に来る
    // remove のうち除外する残り数で表す（TODO-066・TODO-077）。canContinue が常に偽
    // なので、forced な place は必ず解なしになる。
    let pendingExempt = 0;
    for (let i = 0; i < steps.length; i += 1) {
      const step = steps[i];
      if (step.type === 'place') {
        const boardBeforePlace = board;
        board = place(board, step.name, step.cells, step.row, step.col);
        if (isForcedFillStep(boardBeforePlace, step)) {
          pendingExempt = 2;
        } else if (hasUnfitClosedRegion(board) || hasUncoverableCellOnBoard(board)) {
          pendingExempt = 1;
        } else {
          pendingExempt = 0;
        }
        continue;
      }
      board = remove(board, step.name);
      assertSame(step.ok, false, `${step.name} の remove の ok が false でない`);
      if (pendingExempt > 0) {
        pendingExempt -= 1;
        // まだ盤に手が無ければ、2 手目の remove は起きない（stack.length===0）。
        if (pendingExempt > 0 && placedNames(board).length === 0) pendingExempt = 0;
        continue;
      }
      const next = steps[i + 1];
      if (!next) break; // limit で打ち切った末尾。連なりが本当に終わったかは分からない
      if (next.type === 'place') {
        sawRemoveRun = true;
        assertSame(placedNames(board).length, 0,
          '常に偽の判定なのに remove の連なりの終わりで盤にピースが残っている');
      }
    }
    assert(sawRemoveRun, '選んだシード・手数で remove の連なりが一度も終わらなかった');
  });

  test(`ok:false の place の直後に、別の place が続くことがある（即座には外さない、${spec.label}）`, () => {
    // regionsFitPieces を canContinue に渡すと、ok:false は必ず「5 の倍数でない
    // 閉じた空き」を意味し、TODO-068 の分岐で直後に必ずその場で外れてしまう。
    // 「行き詰まってから戻す」流れ（置ける手が尽きるまで ok:false の place が
    // 続く）を起こすため、regionsFitPieces より厳しい hasSolution（実際の解と
    // 照合する。上の「hasSolution を渡すと…」の節と同じ判定）を canContinue に渡す。
    const canContinue = (board) => hasSolution(solutionsForSpec, board);
    const steps = randomSteps(spec, mulberry32(FAST_SEED[spec.key]), canContinue, 3000);
    let sawPlaceAfterFalsePlace = false;
    for (let i = 0; i < steps.length - 1; i += 1) {
      if (steps[i].type === 'place' && steps[i].ok === false && steps[i + 1].type === 'place') {
        sawPlaceAfterFalsePlace = true;
        break;
      }
    }
    assert(sawPlaceAfterFalsePlace,
      '選んだシード・手数で、ok:false の place の直後に別の place が一度も出なかった');
  });

  test(`「解なし」だった置き方は盤面ごとに覚え、同じ盤面で同じ置き方をもう一度 place しない（${spec.label}）`, () => {
    // 置いた手は ok の真偽によらずいったん stack に積まれ、place の yield として
    // 出る（regionsFitPieces を渡すと、ok:false ならその直後の remove ですぐ
    // 外れる。それでも「積んでから外す」という手順自体は変わらない。reviewer
    // 報告 TODO-068 の指摘 4）。外すときにだけ、外した後の盤面へその置き方を
    // 控える。手元でも同じやり方で
    // 控え（failedByBoard）を再現し、控えた（盤面, 置き方）の組がもう一度
    // place として出てきたら失敗とみなす。
    const STEPS = 8000;
    const sigOf = (step) => `${step.name}:${JSON.stringify(step.cells)}:${step.row}:${step.col}`;
    const failedByBoard = new Map(); // boardKey(盤面) -> Set(置き方の組)
    const failedOf = (key) => {
      if (!failedByBoard.has(key)) failedByBoard.set(key, new Set());
      return failedByBoard.get(key);
    };
    const activeStack = []; // 盤に今も残っている手（置いた順。solveStepsRandom の stack と同じ並び）

    let board = createBoard(spec);
    let checked = 0;
    let removed = 0;
    let taken = 0;
    for (const step of solveStepsRandom(spec, mulberry32(FAST_SEED[spec.key]), regionsFitPieces)) {
      taken += 1;
      if (taken > STEPS) break;
      if (step.type === 'place') {
        const beforeKey = boardKey(board);
        const sig = sigOf(step);
        assert(!failedOf(beforeKey).has(sig),
          `${step.name} を、以前 remove した同じ盤面・同じ置き方でもう一度 place した`);
        checked += 1;
        board = place(board, step.name, step.cells, step.row, step.col);
        activeStack.push({ sig, name: step.name });
      } else if (step.type === 'remove') {
        board = remove(board, step.name);
        removed += 1;
        const popped = activeStack.pop();
        assert(popped && popped.name === step.name,
          `${step.name} の remove が、控えのスタックの先頭と合わない`);
        failedOf(boardKey(board)).add(popped.sig);
      }
    }
    assert(checked > 0, 'place が 1 度も出なかった（手数を見直すこと）');
    assert(removed > 0, 'remove が一度も起きなかった（手数を見直すこと）');
  });

  test(`外す連なりが ok:true で止まったとき、まだ（控えていない）置ける手が残っていて、崩し（TODO-063）も起きなければ、次は必ず place になる（${spec.label}）`, () => {
    // 「ok:true になったら break する」ことは、置ける手が本当に無いのに外し
    // 続けている（＝ break を忘れた）ことでは検知しづらい場面がある
    // （ok:true の直後に、盤面ごとの控えのせいで本当に置ける手が無く、
    // すぐ次の連なりが始まることが実際にある）。そこで「まだ置ける手が
    // 残っている場面」に絞り、そのときは必ず次が place になることを見る。
    //
    // ただし、置ける手が尽きた連なり（行き詰まり）が終わるたびに、その深さ
    // （盤に残るピース数）で何回目かを数え、DEMO.randomCollapseAfter 回目
    // なら続けて DEMO.randomCollapseMoves 手を remove として崩す（TODO-063）。
    // 崩しの続きの remove は「次は必ず place」に当てはまらないので、手元でも
    // 同じ規則（maybeCollapse()）で崩しの発生を再現し、崩しの間は確かめない。
    // 置いた直後のその場外し（TODO-060/066〜068・077）は崩しに数えないので、
    // 行き詰まりの連なりかどうかを、置いた直後の判定（isForcedFillStep・
    // hasUnfitClosedRegion・hasUncoverableCellOnBoard）で見分ける（上の
    // 「置ける手が尽きて 1 手ずつ外す並び…」のテストと同じ分け方）。
    const STEPS = 4000;
    const sigOf = (step) => `${step.name}:${JSON.stringify(step.cells)}:${step.row}:${step.col}`;
    const failedByBoard = new Map();
    const failedOf = (key) => {
      if (!failedByBoard.has(key)) failedByBoard.set(key, new Set());
      return failedByBoard.get(key);
    };
    const activeStack = [];
    const steps = [];
    let taken = 0;
    for (const step of solveStepsRandom(spec, mulberry32(FAST_SEED[spec.key]), regionsFitPieces)) {
      taken += 1;
      if (taken > STEPS) break;
      steps.push(step);
    }

    /** 盤に残っていないピースのうち、この盤面でまだ控えていない置き方が 1 つでもあるか。 */
    function hasUnfailedMove(board, failedHere) {
      const remaining = NAMES.filter((name) => !placedNames(board).includes(name));
      for (const name of remaining) {
        for (const shape of orientations(cellsOf(name))) {
          for (let row = 0; row < spec.rows; row += 1) {
            for (let col = 0; col < spec.cols; col += 1) {
              if (canPlace(board, shape, row, col).ok
                && !failedHere.has(`${name}:${JSON.stringify(shape)}:${row}:${col}`)) {
                return true;
              }
            }
          }
        }
      }
      return false;
    }

    let board = createBoard(spec);
    const doRemove = (name) => {
      board = remove(board, name);
      const popped = activeStack.pop();
      failedOf(boardKey(board)).add(popped.sig);
    };

    const collapseCounts = new Map(); // 深さ -> その深さで行き詰まった回数（maybeCollapse() と同じ規則）
    let checkedRunEnds = 0;
    let i = 0;
    while (i < steps.length) {
      const step = steps[i];
      if (step.type === 'place') {
        const boardBeforePlace = board;
        board = place(board, step.name, step.cells, step.row, step.col);
        activeStack.push({ sig: sigOf(step), name: step.name });
        const forcedFail = step.ok === false && isForcedFillStep(boardBeforePlace, step);
        const unfitRegion = !forcedFail && hasUnfitClosedRegion(board);
        const uncoverableRegion = !forcedFail && !unfitRegion && hasUncoverableCellOnBoard(board);
        i += 1;
        if (forcedFail) {
          if (i >= steps.length) break; // limit で打ち切った末尾
          doRemove(steps[i].name);
          i += 1;
          if (placedNames(board).length > 0) {
            if (i >= steps.length) break;
            doRemove(steps[i].name);
            i += 1;
          }
        } else if (unfitRegion || uncoverableRegion) {
          if (i >= steps.length) break;
          doRemove(steps[i].name);
          i += 1;
        }
        continue;
      }
      // 置ける手が尽きた連なり（行き詰まり）の始まり。ok:true か盤が空になるまで
      // 1 手ずつ外す（連なりの中身自体は上のテストで確かめる。ここでは
      // 終わった位置と、その先の崩しの有無だけを使う）。
      let runEndOk = false;
      for (;;) {
        if (i >= steps.length) break; // limit で打ち切った末尾
        doRemove(steps[i].name);
        runEndOk = steps[i].ok;
        i += 1;
        if (runEndOk || placedNames(board).length === 0) break;
      }

      // 行き詰まりの一続きが終わるたびに、その深さでの回数を数える（TODO-063）。
      const depth = placedNames(board).length;
      const count = (collapseCounts.get(depth) || 0) + 1;
      collapseCounts.set(depth, count);
      if (count >= DEMO.randomCollapseAfter) {
        const moves = Math.min(DEMO.randomCollapseMoves, placedNames(board).length);
        let truncated = false;
        for (let k = 0; k < moves; k += 1) {
          if (i >= steps.length) { truncated = true; break; } // limit で打ち切った末尾。これ以上は確かめない
          assert(steps[i] && steps[i].type === 'remove',
            `深さ ${depth} で ${DEMO.randomCollapseAfter} 回目の行き詰まりのはずなのに、崩し（TODO-063）の remove が続かない（外す手数が少ない？）`);
          doRemove(steps[i].name);
          i += 1;
        }
        const newDepth = placedNames(board).length;
        for (const key of [...collapseCounts.keys()]) {
          if (key >= newDepth) collapseCounts.delete(key);
        }
        // 崩しがちょうど moves 手で終われば、置ける手が残っている限り、崩しの
        // あとも「次は必ず place」（上と同じ理屈）に戻るはず。多く外しすぎて
        // いないか（moves を超えて remove が続いていないか）はここで見る。
        if (!truncated && placedNames(board).length > 0
          && hasUnfailedMove(board, failedOf(boardKey(board)))) {
          const next = steps[i];
          if (next) {
            checkedRunEnds += 1;
            assert(next.type === 'place',
              `深さ ${depth} の崩し（${moves} 手）のあと、まだ置ける手が残っているのに次が place でない（外す手数が多い？）`);
          }
        }
        continue;
      }

      if (runEndOk && placedNames(board).length > 0
        && hasUnfailedMove(board, failedOf(boardKey(board)))) {
        const next = steps[i];
        if (!next) break; // limit で打ち切った末尾。次の手は分からない
        checkedRunEnds += 1;
        assert(next.type === 'place',
          `深さ ${depth} の remove の連なりで ok:true になり、まだ置ける手が残っているのに次が place でない`);
      }
    }
    assert(checkedRunEnds > 0, '選んだシード・手数で確かめられる場面が一度も無かった（見直すこと）');
  });

  /**
   * 盤に残っている（置いていない）ピースのうち、この盤面でまだ控えていない
   * 置き方が 1 つでもあるか（TODO-057 の「外す連なりが ok:true で…」と同じ判定）。
   */
  function hasUnfailedMove(board, failedHere) {
    const remaining = NAMES.filter((name) => !placedNames(board).includes(name));
    for (const name of remaining) {
      for (const shape of orientations(cellsOf(name))) {
        for (let row = 0; row < spec.rows; row += 1) {
          for (let col = 0; col < spec.cols; col += 1) {
            if (canPlace(board, shape, row, col).ok
              && !failedHere.has(`${name}:${JSON.stringify(shape)}:${row}:${col}`)) {
              return true;
            }
          }
        }
      }
    }
    return false;
  }

  test(`残りのピースに合わない 5 マスの閉じた空きは、必ず置き済みのピースの形と一致し、即座に外れる（TODO-060/066/067, ${spec.label}）`, () => {
    // 5 マスちょうどの空きは、ピースが 12 種の全ペントミノを 1 つずつ
    // 揃えているため、必ずどれか 1 種の形と一致する。残りのピースに合う
    // 形が無ければ、その一致は置き済みのピースの形とであり、もう埋まらない
    // ので、行き詰まりを待たずにその場で外れる（合う形が残りにあるほうは
    // forcedPlacements が次の place で自分から選ぶので、この節では
    // 確かめない。TODO-066）。他に 5 の倍数でない空き（7 マスなど）も
    // 同時にできている盤面は、TODO-068 の分岐が先に外すので確かめない
    // （`regionsFitPieces(board)` で絞る。reviewer 報告 TODO-068 の指摘 3）。
    //
    // 「置ける手が尽きて外す」連なりの最初の 1 手も、必ず直前に置いた手そのもの
    // （外すのはスタックの最後＝直前に置いた手）になるので、「次が同じ名前の
    // remove かどうか」だけでは、5 の倍数でない空きによる即座の remove と区別できない。
    // 本当に「置ける手が尽きた」のかを、盤面ごとの控え（failed）を手元でも
    // 同じやり方で再現して判定し、まだ控えていない置き方が残っている場面に
    // 絞ることで、置ける手が尽きたことによる remove ではないと言える。
    const STEPS = 6000;
    const sigOf = (step) => `${step.name}:${JSON.stringify(step.cells)}:${step.row}:${step.col}`;
    const failedByBoard = new Map();
    const failedOf = (key) => {
      if (!failedByBoard.has(key)) failedByBoard.set(key, new Set());
      return failedByBoard.get(key);
    };
    const activeStack = [];
    const steps = [];
    let taken = 0;
    for (const step of solveStepsRandom(spec, mulberry32(FAST_SEED[spec.key]), regionsFitPieces)) {
      taken += 1;
      if (taken > STEPS) break;
      steps.push(step);
    }

    let board = createBoard(spec);
    let sawExact = false;
    for (let i = 0; i < steps.length; i += 1) {
      const step = steps[i];
      if (step.type === 'place') {
        const boardBeforePlace = board;
        // この place 自体が forced な解なしで、直後に必ず外されるものなら、
        // TODO-060 の話とは別物なので確かめない（TODO-066）。
        const forcedFail = step.ok === false && isForcedFillStep(boardBeforePlace, step);
        board = place(board, step.name, step.cells, step.row, step.col);
        activeStack.push({ sig: sigOf(step), name: step.name });
        if (!forcedFail) {
          const unusedAfter = NAMES.filter((name) => !placedNames(board).includes(name));
          const sizes = emptyRegionSizes(board);
          const hasExactOnly = sizes.some((size) => size === PIECE_SIZE) && regionsFitPieces(board);
          const noMatchingPiece = forcedPlacements(board, unusedAfter).length === 0;
          if (hasExactOnly && noMatchingPiece && hasUnfailedMove(board, failedOf(boardKey(board)))) {
            sawExact = true;
            // 残りのピースに合わない以上、必ず置き済みのピースの形と一致する
            // （ペントミノは 12 種で全種類が尽くされているため）。
            assert(hasPlacedFormClosedRegion(board),
              `${step.name} を置いて残りのピースに合わない 5 マスの空きができたのに、置き済みのピースの形とも一致しない`);
            // 外すのは TODO-077 の分岐（覆えない空きマス）。置き済みの形の空きは
            // それに含まれる。
            assert(hasUncoverableCellOnBoard(board),
              `${step.name} を置いて置き済みのピースの形の空きができたのに、覆えないマスとして見ていない`);
            const next = steps[i + 1];
            if (next) {
              assert(next.type === 'remove' && next.name === step.name,
                `${step.name} を置いて置き済みのピースの形の 5 マスの空きができたのに、次が同じ名前の remove でない`);
            }
          }
        }
        continue;
      }
      board = remove(board, step.name);
      const popped = activeStack.pop();
      failedOf(boardKey(board)).add(popped.sig);
    }
    assert(sawExact, '選んだシード・手数で確かめられる場面が一度も無かった（見直すこと）');
  });

  test(`残りのどのピースでも覆えない空きマスができたら、行き詰まりを待たずにその場で外す（TODO-077, ${spec.label}）`, () => {
    // TODO-060（5 の倍数でない塊）には当てはまらないのに、残りのピースの
    // どの置き方でも覆えないマスがある盤面（細い袋小路・置き済みの形の空きなど）を
    // 探し、その直後の remove が同じ名前かを見る。
    const STEPS = 6000;
    const steps = randomSteps(spec, mulberry32(FAST_SEED[spec.key]), regionsFitPieces, STEPS);
    let board = createBoard(spec);
    let sawUncoverable = false;
    for (let i = 0; i < steps.length; i += 1) {
      const step = steps[i];
      if (step.type === 'place') {
        const boardBeforePlace = board;
        const forcedFail = step.ok === false && isForcedFillStep(boardBeforePlace, step);
        board = place(board, step.name, step.cells, step.row, step.col);
        if (!forcedFail) {
          if (!hasUnfitClosedRegion(board)) {
            if (hasUncoverableCellOnBoard(board)) {
              sawUncoverable = true;
              const next = steps[i + 1];
              if (next) {
                assert(next.type === 'remove' && next.name === step.name,
                  `${step.name} を置いて残りのどのピースでも覆えない空きマスができたのに、次が同じ名前の remove でない`);
              }
            }
          }
        }
        continue;
      }
      board = remove(board, step.name);
    }
    assert(sawUncoverable, '選んだシード・手数で覆えないマスが一度も出なかった（見直すこと）');
  });

  test(`残りのピースで埋められる 5 マスの閉じた空きがあれば、次の place は必ずそれになる（TODO-066, ${spec.label}）`, () => {
    // `forcedPlacements()` の候補のうち、盤面ごとの控え（failed）に入っている
    // ものは実際には選ばれない（`forcedMoves()` が除くため。TODO-066）。
    // control 用に、手元でも同じ控えを再現してから絞り込む。
    //
    // ピースの選び方が変わり（狭い所の重み付け。TODO-061）、固定の 1 シードでは
    // この場面が毎回出るとは限らなくなったため、複数シードを試す（node で
    // シードの組を 1-5・6-10・…・46-50 の 10 通りずらして、8×8・6×10 とも
    // 出ることを確かめた）。見つけた場面はすべて確かめる（reviewer 報告
    // TODO-061 の検討 1。最初の 1 件で止めると「必ず」の名前と合わない）。
    const SEED_START = 1;
    const SEED_COUNT = 5;
    const sigOf = (name, cells, row, col) => `${name}:${JSON.stringify(cells)}:${row}:${col}`;
    let sawForced = false;
    for (let seed = SEED_START; seed < SEED_START + SEED_COUNT; seed += 1) {
      const steps = randomSteps(spec, mulberry32(seed), regionsFitPieces, 1200);
      const failedByBoard = new Map();
      const failedOf = (key) => {
        if (!failedByBoard.has(key)) failedByBoard.set(key, new Set());
        return failedByBoard.get(key);
      };
      const activeStack = [];
      let board = createBoard(spec);
      for (const step of steps) {
        if (step.type === 'place') {
          const unused = NAMES.filter((name) => !placedNames(board).includes(name));
          const failedHere = failedOf(boardKey(board));
          const forced = forcedPlacements(board, unused)
            .filter((found) => !failedHere.has(sigOf(found.name, found.cells, found.row, found.col)));
          if (forced.length > 0) {
            sawForced = true;
            const placedSig = sigOf(step.name, step.cells, step.row, step.col);
            assert(forced.some((found) => sigOf(found.name, found.cells, found.row, found.col) === placedSig),
              `${step.name} を置く前に合う手（${forced.map((f) => f.name).join(', ')}）があったのに、それ以外を置いた`);
          }
          board = place(board, step.name, step.cells, step.row, step.col);
          activeStack.push(sigOf(step.name, step.cells, step.row, step.col));
        } else {
          board = remove(board, step.name);
          failedOf(boardKey(board)).add(activeStack.pop());
        }
      }
    }
    assert(sawForced,
      `シード ${SEED_START}〜${SEED_START + SEED_COUNT - 1}・手数 1200 以内で、合う手のある 5 マスの穴が一度も出なかった`);
  });

  test(`5 マスの穴に合う手を埋めた直後に解なしになると、その手と直前の手をまとめて外す（TODO-066, ${spec.label}）`, () => {
    // ピースの選び方が変わり（TODO-061）、固定の 1 シードでは forced な解なしの
    // 二重 remove が毎回出るとは限らなくなったため、複数シードを試す（node で
    // シードの組を 1-5・6-10・…・46-50 の 10 通りずらして、8×8・6×10 とも
    // 出ることを確かめた）。見つけた場面はすべて確かめる（reviewer 報告
    // TODO-061 の検討 1。最初の 1 件で止めると「必ず」の名前と合わない）。
    const SEED_START = 1;
    const SEED_COUNT = 5;
    let sawDoubleUndo = false;
    for (let seed = SEED_START; seed < SEED_START + SEED_COUNT; seed += 1) {
      const steps = randomSteps(spec, mulberry32(seed), makeFailAfterForcedFill(), 1200);
      let board = createBoard(spec);
      const activeStack = [];
      let i = 0;
      while (i < steps.length) {
        const step = steps[i];
        if (step.type === 'place') {
          const boardBeforePlace = board;
          board = place(board, step.name, step.cells, step.row, step.col);
          activeStack.push({ name: step.name });
          i += 1;
          if (isForcedFillStep(boardBeforePlace, step)) {
            assertSame(step.ok, false, `${step.name} の forced な place の ok が偽でない`);
            if (i >= steps.length) break;
            assert(steps[i] && steps[i].type === 'remove' && steps[i].name === step.name,
              `${step.name} の forced な place が解なしなのに、直後が同じ名前の remove でない`);
            board = remove(board, steps[i].name);
            activeStack.pop();
            i += 1;
            if (activeStack.length > 0) {
              const prevName = activeStack[activeStack.length - 1].name;
              if (i >= steps.length) break;
              assert(steps[i] && steps[i].type === 'remove' && steps[i].name === prevName,
                `${step.name} を外した直後、その前に置いた ${prevName} の remove が続かない`);
              board = remove(board, steps[i].name);
              activeStack.pop();
              i += 1;
            }
            sawDoubleUndo = true;
          }
          continue;
        }
        board = remove(board, step.name);
        const popped = activeStack.pop();
        assert(popped && popped.name === step.name,
          `${step.name} の remove が、控えのスタックの先頭と合わない`);
        i += 1;
      }
    }
    assert(sawDoubleUndo,
      `シード ${SEED_START}〜${SEED_START + SEED_COUNT - 1}・手数 1200 以内で forced な解なしの二重 remove が一度も起きなかった`);
  });
}

// ---- logic：置き方の重み付け（TODO-059）-----------------------------------

group('src/logic.js — 置き方の重み付け（solveStepsRandom, TODO-059）');

/** 空の盤で、あるピースのすべての置き方（向き×位置）の touchingEdges の一様平均。 */
function uniformMeanTouchingEdges(spec, board, name) {
  let sum = 0;
  let count = 0;
  for (const shape of orientations(cellsOf(name))) {
    for (let row = 0; row < spec.rows; row += 1) {
      for (let col = 0; col < spec.cols; col += 1) {
        if (canPlace(board, shape, row, col).ok) {
          sum += touchingEdges(board, shape, row, col);
          count += 1;
        }
      }
    }
  }
  return sum / count;
}

for (const spec of BOARD_LIST) {
  test(`最初の place は、一様に選ぶより touchingEdges が大きい置き方に偏る（${spec.label}）`, () => {
    // シード 1〜30（多くのシードで確かめて、たまたまの偏りでないことを見る）。
    // ピースは一様に選ぶので、比べる相手は「同じピースの全置き方の一様平均」。
    const SEEDS = 30;
    let chosenSum = 0;
    let uniformSum = 0;
    for (let seed = 1; seed <= SEEDS; seed += 1) {
      const board = createBoard(spec);
      const first = solveStepsRandom(spec, mulberry32(seed), regionsFitPieces).next().value;
      chosenSum += touchingEdges(board, first.cells, first.row, first.col);
      uniformSum += uniformMeanTouchingEdges(spec, board, first.name);
    }
    assert(chosenSum / SEEDS > uniformSum / SEEDS,
      '最初の place の touchingEdges の平均が、一様平均より大きくなっていない');
  });
}

// ---- logic：solveStepsRandom の近さの重み（TODO-062）----------------------

/**
 * `solveStepsRandom()` の抽選で選ばれた place の、直前に置いた手（stack の最後）
 * からの距離の合計と件数。`DEMO.randomNearPower` は呼び出し側で一時的に
 * 書き換えて渡す。1 つのシードだけだと偏ることがあるので呼び出し側で複数
 * シード分を積み上げて平均する。
 *
 * forced な手（TODO-066）に加え、置いた直後にその場で外れる手（5 の倍数でない
 * 空き・置き済みピースの形の空き。TODO-068・067）も除く。すぐ外れる手は
 * 「近さ」の抽選を経ていない（forced と同じく抽選より先に決まる／外れて
 * やり直すノイズ）ため含めると差が埋もれ、シードの組によって逆転する
 * （reviewer 報告 TODO-068 の指摘 1）。
 */
function sumMoveDistanceFromLast(spec, seed, limit) {
  let board = createBoard(spec);
  const stack = [];
  let sum = 0;
  let count = 0;
  let taken = 0;
  for (const step of solveStepsRandom(spec, mulberry32(seed), regionsFitPieces)) {
    taken += 1;
    if (taken > limit) break;
    if (step.type === 'place') {
      const move = { shape: step.cells, row: step.row, col: step.col };
      const last = stack[stack.length - 1];
      const boardBeforePlace = board;
      board = place(board, step.name, step.cells, step.row, step.col);
      const forcedFail = step.ok === false && isForcedFillStep(boardBeforePlace, step);
      const immediateUndo = forcedFail || hasUnfitClosedRegion(board) || hasUncoverableCellOnBoard(board);
      if (last && !immediateUndo) {
        sum += moveDistance(move, last);
        count += 1;
      }
      stack.push(move);
    } else {
      board = remove(board, step.name);
      stack.pop();
    }
  }
  return { sum, count };
}

for (const spec of BOARD_LIST) {
  test(`直前の手に近い置き方ほど選ばれやすい（randomNearPower を 0 にしたときより平均距離が小さい、${spec.label}）`, () => {
    // 1 つのシードだけだとたまたまの偏りが出ることがある一方、既定の
    // randomNearPower（2）では差が小さく、逆転を避けるにはシードや手数を
    // 増やすしかなく重くなる。そこでテストの中でだけ大きい値（4）に上げて
    // 差をはっきりさせ、軽いシード数・手数で比べる。値を上げるだけでは
    // 6×10 でシードの組によって逆転する（reviewer 報告 TODO-068 の指摘 1）ため、
    // 置いた直後にその場で外れる手（TODO-068・067）も除いた
    // （node でシードの組を 1-5・6-10・…・46-50 の 10 通りずらして、
    // 8×8・6×10 とも全通り成り立つことを確かめた。実測、1 盤あたり 1 秒未満）。
    const SEEDS = 5;
    const savedPower = DEMO.randomNearPower;
    let withNear = { sum: 0, count: 0 };
    let withoutNear = { sum: 0, count: 0 };
    try {
      for (let seed = 1; seed <= SEEDS; seed += 1) {
        DEMO.randomNearPower = 4;
        const a = sumMoveDistanceFromLast(spec, seed, 300);
        withNear.sum += a.sum;
        withNear.count += a.count;
        DEMO.randomNearPower = 0;
        const b = sumMoveDistanceFromLast(spec, seed, 300);
        withoutNear.sum += b.sum;
        withoutNear.count += b.count;
      }
    } finally {
      DEMO.randomNearPower = savedPower;
    }
    assert(withNear.count > 0 && withoutNear.count > 0,
      '選んだシード・手数で、比べられる place（forced・即座の remove を除く）が一度も無かった');
    const withNearAvg = withNear.sum / withNear.count;
    const withoutNearAvg = withoutNear.sum / withoutNear.count;
    assert(withNearAvg < withoutNearAvg,
      `randomNearPower を効かせたときの平均距離（${withNearAvg}）が、`
      + `効かせないとき（${withoutNearAvg}）より小さくなっていない`);
  });
}

// ---- logic：狭い所の重み（countCellMoves, solveStepsRandom, TODO-061）-----

group('src/logic.js — 狭い所の重み（countCellMoves, TODO-061）');

test('countCellMoves は、空きマスごとにそれを覆う手の数を手で数えた値と一致する', () => {
  // moveDistance のテスト（TODO-062）と同じく、実際の盤ではなく手で数えられる
  // 小さな choices（ピースごとの手の配列の配列）を組み立てる。
  // A: (0,0) だけを覆う手・(0,1) だけを覆う手の 2 つ
  // B: (0,0) と (0,1) をどちらも覆う手が 1 つ
  // C: (0,0) だけを覆う手が 1 つ

    [{ row: 0, col: 0, shape: [[0, 0]] }, { row: 0, col: 1, shape: [[0, 0]] }], // A
    [{ row: 0, col: 0, shape: [[0, 0], [0, 1]] }], // B
    [{ row: 0, col: 0, shape: [[0, 0]] }], // C
  ];
  const counts = countCellMoves(choices);

test('countCellMoves は、どの手にも覆われないマスを持たない（空の choices は空の Map）', () => {
  assertSame(countCellMoves([]).size, 0);
});

/**
 * `board` の時点での `solveStepsRandom()` の choices を、手元でも同じやり方
 * （`unusedNames`・`failedSet` による除外）で再現する。狭い所の判定に使う
 * `countCellMoves()` へそのまま渡せる形（ピースごとの手の配列の配列）で返す。
 */
function computeChoices(spec, board, unusedNames, failedSet) {
  const choices = [];
  for (const name of unusedNames) {
    const moves = [];
    for (const shape of orientations(cellsOf(name))) {
      for (let row = 0; row < spec.rows; row += 1) {
        for (let col = 0; col < spec.cols; col += 1) {
          if (canPlace(board, shape, row, col).ok) {
            const sig = `${name}:${JSON.stringify(shape)}:${row}:${col}`;
            if (!failedSet.has(sig)) moves.push({
              name, shape, row, col, sig,
            });
          }
        }
      }
    }
    if (moves.length > 0) choices.push(moves);
  }
  return choices;
}

/**
 * `place` の直前の盤面から、`countCellMoves()` で「狭い所」（覆える手が
 * 一番少ない空きマス）を求める。同数で並んだマスが複数あるときは、
 * `solveStepsRandom()` の内部の `random()` で 1 つに絞っており外からは
 * 追えないので、`tightCells`（同数の全部）をそのまま返す。
 */
function tightCellsOf(choices) {
  const counts = countCellMoves(choices);
  const min = Math.min(...counts.values());
  return [...counts.entries()].filter(([, count]) => count === min).map(([key]) => key);
}

for (const spec of BOARD_LIST) {
  test(`狭い所を覆える手が一番少ないマスを唯一絞れる場面では、その手を持つピースを選んだ place は必ずそれを覆う（${spec.label}）`, () => {
    // 「狭い所」が同数タイで複数あると、実際に絞り込んだ 1 マスは
    // solveStepsRandom() 内部の random() で決まり、外からは追えない
    // （上の tightCellsOf() の説明）。タイが無い（狭い所が 1 マスに絞れる）
    // 場面だけに絞れば、その 1 マスが実際に絞り込んだマスと一致するので、
    // 「そのマスを覆える手を持つピースを選んだら、置き方も必ずそのマスを
    // 覆う」という絞り込みの結果を確かめられる（node で seed 1〜20、
    // 8×8・6×10 とも成り立つことを確かめた）。
    const steps = randomSteps(spec, mulberry32(FAST_SEED[spec.key]), regionsFitPieces, 1500);
    const failedByBoard = new Map();
    const failedOf = (key) => {
      if (!failedByBoard.has(key)) failedByBoard.set(key, new Set());
      return failedByBoard.get(key);
    };
    const activeStack = [];
    let board = createBoard(spec);
    let checked = 0;
    for (const step of steps) {
      if (step.type === 'place') {
        const before = board;
        if (!isForcedFillStep(before, step)) {
          const unused = NAMES.filter((name) => !placedNames(before).includes(name));
          const failedHere = failedOf(boardKey(before));
          const choices = computeChoices(spec, before, unused, failedHere);
          // 1 種類しか入らないマスがあれば singlePieceCell（TODO-082）が狭い所より
          // 先に効き、この絞り込みとは無関係な理由でそこを覆う。その場面は除く。
          const single = singlePieceCell(choices, () => 0);
          const tightCells = tightCellsOf(choices);
          if (!single && tightCells.length === 1) {
            const [tightCell] = tightCells;
            const pieceMoves = choices.find((moves) => moves[0].name === step.name) || [];
            const pieceCanCoverTight = pieceMoves.some((m) => m.shape
              .some(([dr, dc]) => `${m.row + dr},${m.col + dc}` === tightCell));
            if (pieceCanCoverTight) {
              checked += 1;
              const covered = step.cells.some(([dr, dc]) => `${step.row + dr},${step.col + dc}` === tightCell);
              assert(covered,
                `${step.name} は狭い所（${tightCell}）を覆える手を持っていたのに、実際の置き方は覆っていない`);
            }
          }
        }
        board = place(board, step.name, step.cells, step.row, step.col);
        activeStack.push({ sig: `${step.name}:${JSON.stringify(step.cells)}:${step.row}:${step.col}`, name: step.name });
      } else {
        board = remove(board, step.name);
        const popped = activeStack.pop();
        failedOf(boardKey(board)).add(popped.sig);
      }
    }
    assert(checked > 0, '選んだシード・手数で、狭い所を唯一絞れて確かめられる場面が一度も無かった');
  });
}

/**
 * `solveStepsRandom()` の抽選で選ばれた place（forced を除く）のうち、
 * 「狭い所」（`countCellMoves()` で数えた、覆える手が一番少ない空きマスの
 * どれか）を覆った件数と、比べる対象の件数。`DEMO.randomTightWeight` は
 * 呼び出し側で一時的に書き換えて渡す。
 */
function sumTightCoverage(spec, seed, limit) {
  let board = createBoard(spec);
  const activeStack = [];
  const failedByBoard = new Map();
  const failedOf = (key) => {
    if (!failedByBoard.has(key)) failedByBoard.set(key, new Set());
    return failedByBoard.get(key);
  };
  let covered = 0;
  let total = 0;
  let taken = 0;
  for (const step of solveStepsRandom(spec, mulberry32(seed), regionsFitPieces)) {
    taken += 1;
    if (taken > limit) break;
    if (step.type === 'place') {
      const before = board;
      if (!isForcedFillStep(before, step)) {
        const unused = NAMES.filter((name) => !placedNames(before).includes(name));
        const failedHere = failedOf(boardKey(before));
        const choices = computeChoices(spec, before, unused, failedHere);
        // singlePieceCell（TODO-082）が当たる場面は、狭い所の重みと無関係に
        // 置く手が絞られるので、割合には数えない（reviewer 報告の検討 2）。
        if (!singlePieceCell(choices, () => 0)) {
          const tightCells = tightCellsOf(choices);
          total += 1;
          if (step.cells.some(([dr, dc]) => tightCells.includes(`${step.row + dr},${step.col + dc}`))) covered += 1;
        }
      }
      board = place(board, step.name, step.cells, step.row, step.col);
      activeStack.push({ sig: `${step.name}:${JSON.stringify(step.cells)}:${step.row}:${step.col}`, name: step.name });
    } else {
      board = remove(board, step.name);
      const popped = activeStack.pop();
      failedOf(boardKey(board)).add(popped.sig);
    }
  }
  return { covered, total };
}

for (const spec of BOARD_LIST) {
  test(`狭い所を覆える手のあるピースを選びやすい抽選になっている（狭い所を覆った place の割合が、DEMO.randomTightWeight を 1 にしたときより大きい、${spec.label}）`, () => {
    // node でシードの組を 1-5・6-10・…・46-50 の 10 通りずらして、8×8・6×10
    // とも成り立つことを確かめた（1 組あたり 1 秒未満）。
    const SEEDS = 5;
    const LIMIT = 200;
    const savedWeight = DEMO.randomTightWeight;
    const withWeight = { covered: 0, total: 0 };
    const withoutWeight = { covered: 0, total: 0 };
    try {
      for (let seed = 1; seed <= SEEDS; seed += 1) {
        DEMO.randomTightWeight = savedWeight;
        const a = sumTightCoverage(spec, seed, LIMIT);
        withWeight.covered += a.covered;
        withWeight.total += a.total;
        DEMO.randomTightWeight = 1;
        const b = sumTightCoverage(spec, seed, LIMIT);
        withoutWeight.covered += b.covered;
        withoutWeight.total += b.total;
      }
    } finally {
      DEMO.randomTightWeight = savedWeight;
    }
    assert(withWeight.total > 0 && withoutWeight.total > 0,
      '選んだシード・手数で、比べられる place（forced を除く）が一度も無かった');
    const rateWith = withWeight.covered / withWeight.total;
    const rateWithout = withoutWeight.covered / withoutWeight.total;
    assert(rateWith > rateWithout,
      `DEMO.randomTightWeight を効かせたときの割合（${rateWith}）が、`
      + `1 にしたとき（${rateWithout}）より大きくなっていない`);
  });
}

/**
 * `singlePieceCell()` と同じやり方で、覆える手が 1 種類のピースにしか無い
 * 空きマスをすべて集め、count が一番少ないマス（同数の全部）を返す。
 * `tightCellsOf()` と同じ理由で、タイが複数ピースにまたがると
 * `solveStepsRandom()` 内部の `random()` でどのピースが選ばれるか外からは
 * 追えないので、その場合は null にして確かめる対象から除く。
 */
function singlePieceCandidates(choices) {
  const cells = new Map();
  choices.forEach((moves, pick) => {
    for (const move of moves) {
      for (const [dr, dc] of move.shape) {
        const key = `${move.row + dr},${move.col + dc}`;
        const cell = cells.get(key);
        if (!cell) {
          cells.set(key, { pick, count: 1 });
        } else {
          if (cell.pick !== pick) cell.pick = -1;
          cell.count += 1;
        }
      }
    }
  });
  const singles = [...cells].filter(([, c]) => c.pick >= 0);
  if (singles.length === 0) return null;
  const min = Math.min(...singles.map(([, c]) => c.count));
  const candidates = singles.filter(([, c]) => c.count === min);
  const picks = new Set(candidates.map(([, c]) => c.pick));
  if (picks.size !== 1) return null;
  return { pick: candidates[0][1].pick, cells: candidates.map(([key]) => key) };
}

// ---- logic：解の無い盤面での打ち切り（solveStepsRandom, DEMO.randomDeadLimit, TODO-081）----
//
// canContinue に hasSolution を渡し（上の「hasSolution を渡すと…」の節と同じ）、
// 最初の solved まで回す。「直前の盤面が ok 偽のまま続けて置いた place の数」を
// 手元でも数え、DEMO.randomDeadLimit を超えないこと・超えた直後は ok になるまで
// remove が続くことを、同じ 1 回の走査の中で確かめる。

const DEAD_LIMIT_SEEDS = [FAST_SEED, OTHER_SEED, { '8x8': 7, '6x10': 7 }];

for (const state of boardStates) {
  const { spec, solutions } = state;
  const canContinue = (board) => hasSolution(solutions, board);

  test(`解の無い盤面で続けて置いた手が DEMO.randomDeadLimit（${DEMO.randomDeadLimit}）を超えず、超えた直後は ok になるまで remove が続く（${spec.label}）`, () => {
    const STEP_LIMIT = 2000000; // 安全弁（最初の解までに手を尽くしすぎたら見直す）
    let sawLimitHit = false;
    for (const seed of DEAD_LIMIT_SEEDS.map((s) => s[spec.key])) {
      let boardOk = true; // 直前の盤面が canContinue を満たすか（空の盤は真）
      let deadRun = 0; // 解の無い盤面の上で続けて置いた手の数（remove で ok が真になったら 0 に戻す）
      let awaitingOk = false; // deadRun が上限に達した直後、ok になるまでの区間
      let solved = false;
      let taken = 0;
      for (const step of solveStepsRandom(spec, mulberry32(seed), canContinue)) {
        taken += 1;
        if (taken > STEP_LIMIT) throw new Error('手数の上限を超えた（シードを見直すこと）');
        if (step.type === 'solved') { solved = true; break; }
        if (step.type === 'place') {
          assert(!awaitingOk,
            `DEMO.randomDeadLimit に達した直後なのに、ok になる前に ${step.name} を place した`);
          if (!boardOk) deadRun += 1;
          assert(deadRun <= DEMO.randomDeadLimit,
            `解の無い盤面で続けて置いた手が ${deadRun} 回になり、DEMO.randomDeadLimit（${DEMO.randomDeadLimit}）を超えた`);
          if (deadRun === DEMO.randomDeadLimit) { sawLimitHit = true; awaitingOk = true; }
          boardOk = step.ok;
        } else if (step.type === 'remove') {
          boardOk = step.ok;
          if (boardOk) { deadRun = 0; awaitingOk = false; }
        }
      }
      assert(solved, `シード ${seed} で最初の解に至らなかった（STEP_LIMIT を見直すこと）`);
    }
    assert(sawLimitHit,
      '選んだシードのどれでも、DEMO.randomDeadLimit に達する場面が一度も無かった（見直すこと）');
  });

  test(`DEMO.randomDeadLimit で戻った一続きも、TODO-063 の崩し（maybeCollapse）に数える（${spec.label}）`, () => {
    // hasSolution は regionsFitPieces よりずっと厳しいので、置ける手が尽きるより先に
    // 上限に達しやすい。上限で戻った一続きだけで崩しが起きることを狙って見るため、
    // 上限を 1（1 手 ok:false ならすぐ戻る）、崩しの閾値を 1 回目（すぐ崩す）に
    // 下げて走らせる（DEMO を書き換えて try/finally で戻すのは既存のテストと同じ。
    // tests.html:2204・2394）。
    const TEMP_DEAD_LIMIT = 1;
    const TEMP_COLLAPSE_AFTER = 1;
    const TEMP_COLLAPSE_MOVES = 2;
    const savedDeadLimit = DEMO.randomDeadLimit;
    const savedCollapseAfter = DEMO.randomCollapseAfter;
    const savedCollapseMoves = DEMO.randomCollapseMoves;
    const STEP_LIMIT = 2000000;
    let boardOk = true;
    let deadRun = 0;
    let depth = 0; // 盤に残っているピースの数（stack.length と同じ数え方）
    let triggerDepth = -1; // 上限に達した瞬間の深さ（-1 は「まだ見ていない」）
    let settleDepth = -1; // その後 ok:true になった深さ
    let pendingExtra = -1; // 崩しで、あと何手 remove が続くはずか（-1 はまだ見ていない）
    let checkedExtra = false; // pendingExtra が 0 になって崩しを確かめ終えた
    let collapseBroken = false; // 崩しの途中のはずなのに remove 以外が出た
    try {
      DEMO.randomDeadLimit = TEMP_DEAD_LIMIT;
      DEMO.randomCollapseAfter = TEMP_COLLAPSE_AFTER;
      DEMO.randomCollapseMoves = TEMP_COLLAPSE_MOVES;
      let taken = 0;
      for (const step of solveStepsRandom(spec, mulberry32(FAST_SEED[spec.key]), canContinue)) {
        taken += 1;
        if (taken > STEP_LIMIT) throw new Error('手数の上限を超えた（見直すこと）');
        if (checkedExtra || collapseBroken) break;
        // settleDepth が決まった直後は、pendingExtra 手ぶんは必ず remove のはず
        // （崩しの途中で place や solved が来たら、崩しが起きなかったということ）。
        if (pendingExtra > 0 && step.type !== 'remove') { collapseBroken = true; break; }
        if (step.type === 'solved') break;
        if (step.type === 'place') {
          depth += 1;
          if (!boardOk) deadRun += 1;
          if (deadRun === DEMO.randomDeadLimit && triggerDepth < 0) triggerDepth = depth;
          boardOk = step.ok;
        } else if (step.type === 'remove') {
          depth -= 1;
          boardOk = step.ok;
          if (boardOk) deadRun = 0;
          if (pendingExtra > 0) {
            pendingExtra -= 1;
            if (pendingExtra === 0) checkedExtra = true;
          } else if (triggerDepth >= 0 && settleDepth < 0 && boardOk) {
            settleDepth = depth;
            pendingExtra = Math.min(TEMP_COLLAPSE_MOVES, settleDepth);
            if (pendingExtra === 0) checkedExtra = true;
          }
        }
      }
    } finally {
      DEMO.randomDeadLimit = savedDeadLimit;
      DEMO.randomCollapseAfter = savedCollapseAfter;
      DEMO.randomCollapseMoves = savedCollapseMoves;
    }
    assert(triggerDepth >= 0,
      `選んだシードで DEMO.randomDeadLimit（${TEMP_DEAD_LIMIT}）に達する場面が一度も無かった（見直すこと）`);
    assert(settleDepth >= 0, '上限に達したあと ok:true になる場面が無かった（見直すこと）');
    assert(!collapseBroken,
      '上限で戻って ok:true になった直後、崩し（TODO-063）の途中のはずなのに remove 以外が出た');
    assert(checkedExtra, '上限で戻って ok:true になった直後、崩し（TODO-063）の remove が続かなかった');
  });
}

//

// 検査は公開のとき（`pages.yml`）に回し**、ここでは生成し直さずに済む軽いほう
// ——件数と、各行が本当に解になっているか——を確かめる。

group('src/data — 全解のデータ');

for (const state of boardStates) {
  const { spec, canonical } = state;
  const known = KNOWN_COUNTS[spec.key];

  test(`代表形の件数が ${known.canonical} 件（${spec.label}）`, () => {
    assertSame(canonical.length, known.canonical, '件数');
  });

  test(`どの行も盤の大きさどおりの長さで、穴の位置が合っている（${spec.label}）`, () => {
    const holes = boardKey(createBoard(spec)).split('')
      .map((ch, i) => (ch === HOLE ? i : -1)).filter((i) => i >= 0);
    for (const cells of canonical) {
      assertSame(cells.length, spec.rows * spec.cols, `長さ: ${cells}`);
      for (const index of holes) {
        assert(cells[index] === HOLE, `穴 ${index} が埋まっている: ${cells}`);
      }
      assertSame(cells.split('').filter((ch) => ch === HOLE).length, holes.length,
        `穴の数が合わない: ${cells}`);
    }
  });

  test(`どの行も 12 種が 1 個ずつで、5 マスずつ使っている（${spec.label}）`, () => {
    for (const cells of canonical) {
      const counts = new Map();
      for (const ch of cells) {
        if (ch === HOLE) continue;
        counts.set(ch, (counts.get(ch) || 0) + 1);
      }
      assertSame([...counts.keys()].sort().join(''), NAMES.slice().sort().join(''),
        `使っているピース: ${cells}`);
      for (const [name, count] of counts) {
        assertSame(count, PIECE_SIZE, `${name} のマス数: ${cells}`);
      }
    }
  });

  test(`どの行も、各ピースの形が元の形の回転・反転になっている（${spec.label}）`, () => {
    // ここが「本当に解になっているか」の要。マス数が合っていても、
    // 5 マスがばらばらの位置にあってはペントミノの解ではない。
    // 向きは 12 種ぶんを先に作っておく（行ごとに作り直すと桁違いに遅くなる）。
    const known2 = new Map(NAMES.map((name) => [
      name,
      new Set(orientations(cellsOf(name)).map((shape) => JSON.stringify(shape))),
    ]));
    for (const cells of canonical) {
      for (const name of NAMES) {
        const placement = placementIn(cells, spec.cols, name);
        assert(known2.get(name).has(JSON.stringify(placement.cells)),
          `${name} の形が変: ${cells}`);
      }
    }
  });

  test(`どの行もそれ自身が代表形（${spec.label}）`, () => {
    for (const cells of canonical) {
      assertSame(canonicalCellsKey(cells, spec), cells, `代表形になっていない: ${cells}`);
    }
  });

  test(`重複が無く、文字列の昇順に並んでいる（${spec.label}）`, () => {
    // 並びがそのまま解の番号になるので、作り直すたびに変わっては困る。
    assertSame(new Set(canonical).size, canonical.length, '重複がある');
    for (let i = 1; i < canonical.length; i += 1) {
      assert(canonical[i - 1] < canonical[i],
        `${i - 1} と ${i} の順が逆: ${canonical[i - 1]} / ${canonical[i]}`);
    }
  });
}
