<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pentomino Puzzle — テスト</title>
<style>
  body {
    margin: 0;
    padding: 2rem 1.5rem 4rem;
    background: #181b26;
    color: #e8ecf4;
    font-family: system-ui, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.7;
  }
  h1 { font-size: 1.4rem; margin: 0 0 0.4rem; }
  h2 { font-size: 1rem; margin: 1.6rem 0 0.4rem; color: #8d97b0; font-weight: normal; }
  #summary { font-size: 1.1rem; margin-bottom: 0.4rem; }
  #summary.pass { color: #7fdc8c; }
  #summary.fail { color: #ff5555; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 0.1rem 0; }
  li.ok::before { content: "PASS"; color: #7fdc8c; margin-right: 0.7em; }
  li.ng::before { content: "FAIL"; color: #ff5555; margin-right: 0.7em; }
  li.ng { color: #ff9d9d; }
  li::before { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.85em; }
  .why { display: block; padding-left: 3.4em; color: #ff9d9d; font-size: 0.9em; }
  .note { color: #8d97b0; font-size: 0.9em; }
</style>
</head>
<body>
<h1>Pentomino Puzzle — テスト</h1>
<p class="note">
  <code>src/logic.js</code>・<code>src/solver.js</code>・<code>src/config.js</code> の計算を確かめる。
  Phaser にも DOM にも触らない部分だけが対象。
</p>
<div id="summary">実行中…</div>
<div id="results"></div>

<script type="module">
import { BOARD_SPEC, PIECES, PIECE_SIZE, PLAYABLE_CELLS, HOLE, SOLVER_LIMIT } from './src/config.js';
import {
  normalize, rotateCw, flip, sameShape, orientations, shapeSize,
  boardCells, createBoard, cellAt, canPlace, place, remove,
  emptyCells, placedNames, isSolved, emptyRegionSizes, regionsFitPieces, formatTime,
} from './src/logic.js';
import { solve, hintPlacement } from './src/solver.js';

// ---- ごく小さなテストの土台 ----------------------------------------------
// 依存を増やさないために自前で持つ。落ちた場所が分かればよいので、
// 例外のメッセージをそのまま出す。

const groups = [];
let current = null;

function group(title) {
  current = { title, cases: [] };
  groups.push(current);
}

function test(title, fn) {
  try {
    fn();
    current.cases.push({ title, ok: true, why: '' });
  } catch (error) {
    current.cases.push({ title, ok: false, why: error.message });
  }
}

function assert(condition, message) {
  if (!condition) throw new Error(message || '成り立たなかった');
}

function assertSame(actual, expected, message) {
  const a = JSON.stringify(actual);
  const b = JSON.stringify(expected);
  if (a !== b) throw new Error(`${message || ''} 期待 ${b} / 実際 ${a}`);
}

const NAMES = PIECES.map((piece) => piece.name);
const cellsOf = (name) => PIECES.find((piece) => piece.name === name).cells;

// ---- config -------------------------------------------------------------

group('src/config.js — ピースの定義');

test('ペントミノは 12 種で、名前が重なっていない', () => {
  assertSame(PIECES.length, 12, '種類の数');
  assertSame(new Set(NAMES).size, 12, '名前の異なり数');
  assertSame(NAMES.join(''), 'FILNPTUVWXYZ', '並び');
});

test('どのピースも 5 マスで、座標が重なっていない', () => {
  for (const piece of PIECES) {
    assertSame(piece.cells.length, PIECE_SIZE, `${piece.name} のマス数`);
    const keys = new Set(piece.cells.map(([r, c]) => `${r},${c}`));
    assertSame(keys.size, PIECE_SIZE, `${piece.name} の重複したマス`);
  }
});

test('どのピースも上下左右で繋がっている', () => {
  for (const piece of PIECES) {
    const keys = new Set(piece.cells.map(([r, c]) => `${r},${c}`));
    const seen = new Set([`${piece.cells[0][0]},${piece.cells[0][1]}`]);
    const stack = [piece.cells[0]];
    while (stack.length > 0) {
      const [r, c] = stack.pop();
      for (const [nr, nc] of [[r - 1, c], [r + 1, c], [r, c - 1], [r, c + 1]]) {
        const key = `${nr},${nc}`;
        if (keys.has(key) && !seen.has(key)) {
          seen.add(key);
          stack.push([nr, nc]);
        }
      }
    }
    assertSame(seen.size, PIECE_SIZE, `${piece.name} が途切れている`);
  }
});

test('12 種の色が重なっていない', () => {
  assertSame(new Set(PIECES.map((piece) => piece.color)).size, 12, '色の異なり数');
});

test('置けるマスの数はピース 12 種ぶんとちょうど同じ', () => {
  assertSame(PLAYABLE_CELLS, PIECES.length * PIECE_SIZE, '60 マス');
});

test('求解の打ち切り上限が正の数として決まっている', () => {
  assert(Number.isFinite(SOLVER_LIMIT) && SOLVER_LIMIT > 0, `上限が変: ${SOLVER_LIMIT}`);
});

// ---- logic：向きの計算 ---------------------------------------------------

group('src/logic.js — 向きの生成');

test('normalize は左上へ寄せ、行優先に並べ替える', () => {
  assertSame(normalize([[3, 5], [2, 6], [2, 5]]), [[0, 0], [0, 1], [1, 0]]);
});

test('rotateCw は L を横向きにする', () => {
  assertSame(rotateCw(cellsOf('L')), [[0, 0], [0, 1], [0, 2], [0, 3], [1, 0]]);
});

test('rotateCw を 4 回で元の向きに戻る', () => {
  for (const piece of PIECES) {
    const start = normalize(piece.cells);
    let turned = start;
    for (let i = 0; i < 4; i += 1) turned = rotateCw(turned);
    assert(sameShape(turned, start), `${piece.name} が戻らない`);
  }
});

test('flip を 2 回で元の向きに戻る', () => {
  for (const piece of PIECES) {
    const start = normalize(piece.cells);
    assert(sameShape(flip(flip(start)), start), `${piece.name} が戻らない`);
  }
});

test('向きの数は X が 1、I が 2、T・U・V・W・Z が 4、残りが 8', () => {
  const expected = {
    F: 8, I: 2, L: 8, N: 8, P: 8, T: 4, U: 4, V: 4, W: 4, X: 1, Y: 8, Z: 4,
  };
  const actual = {};
  for (const piece of PIECES) actual[piece.name] = orientations(piece.cells).length;
  assertSame(actual, expected);
});

test('12 種を合わせた向きは 63 通り', () => {
  const total = PIECES.reduce((sum, piece) => sum + orientations(piece.cells).length, 0);
  assertSame(total, 63);
});

test('同じ向きが 2 つ出てこない', () => {
  for (const piece of PIECES) {
    const list = orientations(piece.cells);
    for (let i = 0; i < list.length; i += 1) {
      for (let j = i + 1; j < list.length; j += 1) {
        assert(!sameShape(list[i], list[j]), `${piece.name} に同じ向きが 2 つある`);
      }
    }
  }
});

test('どの向きも 5 マスのまま', () => {
  for (const piece of PIECES) {
    for (const shape of orientations(piece.cells)) {
      assertSame(shape.length, PIECE_SIZE, `${piece.name}`);
    }
  }
});

test('shapeSize は外接する矩形の大きさを返す', () => {
  assertSame(shapeSize(cellsOf('I')), { rows: 5, cols: 1 });
  assertSame(shapeSize(cellsOf('X')), { rows: 3, cols: 3 });
});

// ---- logic：盤面 ---------------------------------------------------------

group('src/logic.js — 盤面');

test('boardCells は中央 2×2 を抜いた 60 マスを返す', () => {
  const cells = boardCells(BOARD_SPEC);
  assertSame(cells.length, PLAYABLE_CELLS, 'マス数');
  const keys = new Set(cells.map(([r, c]) => `${r},${c}`));
  for (const [r, c] of [[3, 3], [3, 4], [4, 3], [4, 4]]) {
    assert(!keys.has(`${r},${c}`), `穴 (${r},${c}) が含まれている`);
  }
  assert(keys.has('0,0') && keys.has('7,7'), '四隅が欠けている');
});

test('createBoard は空き 60 マスと穴 4 マスの盤を作る', () => {
  const board = createBoard(BOARD_SPEC);
  assertSame(board.grid.length, 64, 'マスの総数');
  assertSame(board.grid.filter((v) => v === null).length, 60, '空き');
  assertSame(board.grid.filter((v) => v === HOLE).length, 4, '穴');
});

test('cellAt は盤の外を穴として扱う', () => {
  const board = createBoard(BOARD_SPEC);
  assertSame(cellAt(board, 0, 0), null);
  assertSame(cellAt(board, 3, 3), HOLE);
  assertSame(cellAt(board, -1, 0), HOLE);
  assertSame(cellAt(board, 8, 0), HOLE);
});

test('canPlace は置ける場所を通す', () => {
  const board = createBoard(BOARD_SPEC);
  assertSame(canPlace(board, cellsOf('I'), 0, 0), { ok: true, reason: null });
});

test('canPlace は盤の外を outside として断る', () => {
  const board = createBoard(BOARD_SPEC);
  assertSame(canPlace(board, cellsOf('I'), 5, 0).reason, 'outside', '下へはみ出す');
  assertSame(canPlace(board, cellsOf('I'), -1, 0).reason, 'outside', '上へはみ出す');
  assertSame(canPlace(board, cellsOf('U'), 0, 6).reason, 'outside', '右へはみ出す');
});

test('canPlace は穴の上を hole として断る', () => {
  const board = createBoard(BOARD_SPEC);
  assertSame(canPlace(board, cellsOf('I'), 0, 3).reason, 'hole');
});

test('canPlace は重なりを overlap として断る', () => {
  const board = place(createBoard(BOARD_SPEC), 'I', cellsOf('I'), 0, 0);
  assertSame(canPlace(board, cellsOf('I'), 0, 0).reason, 'overlap');
  assertSame(canPlace(board, cellsOf('I'), 1, 0).reason, 'overlap');
});

test('place は元の盤面を書き換えずに新しい盤面を返す', () => {
  const board = createBoard(BOARD_SPEC);
  const before = board.grid.slice();
  const after = place(board, 'I', cellsOf('I'), 0, 0);
  assertSame(board.grid, before, '元の盤面が変わった');
  assert(after !== board, '同じ盤面を返している');
  assertSame(after.grid.filter((v) => v === 'I').length, 5, '置いたマス数');
});

test('remove は元の盤面を書き換えずにピースを取り除く', () => {
  const board = place(createBoard(BOARD_SPEC), 'I', cellsOf('I'), 0, 0);
  const before = board.grid.slice();
  const after = remove(board, 'I');
  assertSame(board.grid, before, '元の盤面が変わった');
  assertSame(after.grid.filter((v) => v === 'I').length, 0, '取り除けていない');
  assertSame(after.grid.filter((v) => v === null).length, 60, '空きに戻っていない');
});

test('placedNames と emptyCells が盤の中身と合う', () => {
  const board = place(createBoard(BOARD_SPEC), 'I', cellsOf('I'), 0, 0);
  assertSame(placedNames(board), ['I']);
  assertSame(emptyCells(board).length, 55);
  assertSame(emptyCells(board)[0], [0, 1], '一番若い空きマス');
});

test('isSolved は空きマスが無いときだけ真', () => {
  const board = createBoard(BOARD_SPEC);
  assert(!isSolved(board), '空の盤で真になった');
  const solved = solve(board, NAMES).placements
    .reduce((acc, p) => place(acc, p.name, p.cells, p.row, p.col), board);
  assert(isSolved(solved), '埋めた盤で偽になった');
});

test('emptyRegionSizes は空き領域を連結成分に分ける', () => {
  // F を左上へ置くと (0,0) が 1 マスだけ切り離される。
  const board = place(createBoard(BOARD_SPEC), 'F', cellsOf('F'), 0, 0);
  assertSame(emptyRegionSizes(board), [1, 54]);
});

test('regionsFitPieces は 5 で割り切れない塊があると偽', () => {
  assert(regionsFitPieces(createBoard(BOARD_SPEC)), '空の盤で偽になった');
  const board = place(createBoard(BOARD_SPEC), 'F', cellsOf('F'), 0, 0);
  assert(!regionsFitPieces(board), '1 マスの取り残しを見逃した');
});

test('formatTime は mm:ss、1 時間を超えたら h:mm:ss', () => {
  assertSame(formatTime(0), '00:00');
  assertSame(formatTime(999), '00:00');
  assertSame(formatTime(65432), '01:05');
  assertSame(formatTime(599000), '09:59');
  assertSame(formatTime(3661000), '1:01:01');
});

// ---- solver -------------------------------------------------------------

group('src/solver.js — ヒント用の求解');

const emptyBoard = createBoard(BOARD_SPEC);
const fullSolution = solve(emptyBoard, NAMES);

test('空の盤面から解が 1 つ求まる', () => {
  assert(fullSolution.ok, `解が出なかった: ${fullSolution.reason}`);
  assertSame(fullSolution.placements.length, 12, 'ピースの数');
  assertSame(
    fullSolution.placements.map((p) => p.name).sort().join(''),
    NAMES.slice().sort().join(''),
    '12 種すべてを使っていない',
  );
});

test('その解が盤面をちょうど埋める（重なりも空きも無い）', () => {
  let board = emptyBoard;
  for (const p of fullSolution.placements) {
    const check = canPlace(board, p.cells, p.row, p.col);
    assert(check.ok, `${p.name} が置けない: ${check.reason}`);
    board = place(board, p.name, p.cells, p.row, p.col);
  }
  assert(isSolved(board), '空きマスが残った');
  assertSame(placedNames(board).length, 12, '盤に並んだピースの数');
});

test('解の各ピースは、その向きが元の形の回転・反転になっている', () => {
  for (const p of fullSolution.placements) {
    const known = orientations(cellsOf(p.name));
    assert(known.some((shape) => sameShape(shape, p.cells)), `${p.name} の向きが変`);
  }
});

test('solve は渡した盤面を書き換えない', () => {
  const board = createBoard(BOARD_SPEC);
  const before = board.grid.slice();
  solve(board, NAMES);
  assertSame(board.grid, before);
});

test('詰みの盤面では解なしを返す', () => {
  // F を左上へ置くと (0,0) が 1 マス残り、5 マスのピースでは埋められない。
  const board = place(createBoard(BOARD_SPEC), 'F', cellsOf('F'), 0, 0);
  const result = solve(board, NAMES.filter((name) => name !== 'F'));
  assert(!result.ok, '解が出てしまった');
  assertSame(result.reason, 'unsolvable', '理由');
});

test('ピースの数と空きマスが釣り合わないときも解なし', () => {
  const result = solve(createBoard(BOARD_SPEC), NAMES.slice(0, 11));
  assert(!result.ok, '解が出てしまった');
  assertSame(result.reason, 'unsolvable', '理由');
});

test('試行回数の上限を超えたら limit として打ち切る', () => {
  const result = solve(createBoard(BOARD_SPEC), NAMES, { limit: 10 });
  assert(!result.ok, '打ち切られなかった');
  assertSame(result.reason, 'limit', '理由');
  assert(result.tries <= 11, `試行回数が上限を大きく超えた: ${result.tries}`);
});

test('hintPlacement は一番若い空きマスを覆う 1 手を返す', () => {
  const board = place(createBoard(BOARD_SPEC), 'X', cellsOf('X'), 0, 2);
  const result = hintPlacement(board, NAMES.filter((name) => name !== 'X'));
  assert(result.ok, `ヒントが出なかった: ${result.reason}`);
  const target = emptyCells(board)[0];
  const covers = result.placement.cells
    .some(([dr, dc]) => result.placement.row + dr === target[0]
      && result.placement.col + dc === target[1]);
  assert(covers, `一番若い空きマス (${target}) を覆っていない`);
  assert(canPlace(board, result.placement.cells, result.placement.row, result.placement.col).ok,
    '返ってきた置き方が盤に合わない');
});

test('hintPlacement は詰みの盤面で理由付きの解なしを返す', () => {
  const board = place(createBoard(BOARD_SPEC), 'F', cellsOf('F'), 0, 0);
  const result = hintPlacement(board, NAMES.filter((name) => name !== 'F'));
  assert(!result.ok, '解が出てしまった');
  assertSame(result.reason, 'unsolvable');
  assertSame(result.placement, null);
});

test('途中まで埋めた盤面からも最後まで解ける', () => {
  // 実際に遊んでいる途中の形（正しい解の 4 手ぶん）から続きが求まるか。
  let board = createBoard(BOARD_SPEC);
  const used = [];
  for (const p of fullSolution.placements.slice(0, 4)) {
    board = place(board, p.name, p.cells, p.row, p.col);
    used.push(p.name);
  }
  const result = solve(board, NAMES.filter((name) => !used.includes(name)));
  assert(result.ok, `続きが解けなかった: ${result.reason}`);
  assertSame(result.placements.length, 8, '残りのピースの数');
});

// ---- 結果の表示 ---------------------------------------------------------

const results = document.getElementById('results');
let passed = 0;
let failed = 0;

for (const entry of groups) {
  const heading = document.createElement('h2');
  heading.textContent = entry.title;
  results.appendChild(heading);
  const list = document.createElement('ul');
  for (const item of entry.cases) {
    const li = document.createElement('li');
    li.className = item.ok ? 'ok' : 'ng';
    li.textContent = item.title;
    if (!item.ok) {
      const why = document.createElement('span');
      why.className = 'why';
      why.textContent = item.why;
      li.appendChild(why);
      failed += 1;
    } else {
      passed += 1;
    }
    list.appendChild(li);
  }
  results.appendChild(list);
}

const summary = document.getElementById('summary');
summary.className = failed === 0 ? 'pass' : 'fail';
summary.textContent = failed === 0
  ? `${passed} 件すべて通った`
  : `${failed} 件が失敗（${passed} 件は通った）`;

const note = document.createElement('p');
note.className = 'note';
note.textContent = `参考: 空の盤面の求解は ${fullSolution.tries} 回の試行で 1 解に届いた（上限 ${SOLVER_LIMIT}）。`;
results.appendChild(note);
</script>
</body>
</html>
