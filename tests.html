group('src/solutions.js — 照合とおまかせ');

for (const state of boardStates) {
  const {
    spec, emptyBoard, canonical, solutions, placements, solved,
  } = state;
  const known = KNOWN_COUNTS[spec.key];

  test(`回転・反転まで展開すると全 ${known.all} 解になる（${spec.label}）`, () => {
    assertSame(solutions.keys.length, known.all, '展開後の件数');
    assertSame(solutions.numbers.size, known.all, '番号を引ける件数');
  });

  test(`展開した解の番号が 1〜${known.canonical} を覆っている（${spec.label}）`, () => {
    const numbers = new Set(solutions.numbers.values());
    assertSame(numbers.size, canonical.length, '番号の異なり数');
    assertSame(Math.min(...numbers), 1, '一番小さい番号');
    assertSame(Math.max(...numbers), canonical.length, '一番大きい番号');
  });

  test(`対称で写した解も同じ番号になる（${spec.label}）`, () => {
    const base = solutionNumber(solutions, boardKey(solved));
    assertSame(base, 1, '1 行目なので 1 番のはず');
    for (const sym of boardSymmetries(solved)) {
      assertSame(solutionNumber(solutions, boardKey(transformBoard(solved, sym))), base,
        `${sym.turns}/${sym.flipped} で別の番号になった`);
    }
  });

  test(`番号から代表形を引き直せる（${spec.label}）`, () => {
    for (const no of [1, 2, canonical.length]) {
      assertSame(solutionCells(solutions, no), canonical[no - 1], `${no} 番`);
      assertSame(solutionNumber(solutions, solutionCells(solutions, no)), no, `${no} 番の往復`);
    }
    assertSame(solutionCells(solutions, canonical.length + 1), null, 'はみ出した番号');
    assertSame(solutionNumber(solutions, 'x'.repeat(spec.rows * spec.cols)), null, '無い盤面');
  });

  test(`空の盤面には全 ${known.all} 解が当てはまる（${spec.label}）`, () => {
    assertSame(consistentSolutions(solutions, emptyBoard).length, known.all, '件数');
    assert(hasSolution(solutions, emptyBoard), '解けないと言われた');
  });

  test(`途中まで置いた盤面には、その続きになる解だけが残る（${spec.label}）`, () => {
    // 正しい解の 6 手ぶんを置き、残った候補がどれもその 6 手を含むか。
    let board = emptyBoard;
    for (const p of placements.slice(0, 6)) board = place(board, p.name, p.cells, p.row, p.col);
    const candidates = consistentSolutions(solutions, board);
    assert(candidates.length > 0, '続きが 1 つも出なかった');
    assert(candidates.includes(boardKey(solved)), 'なぞっている解そのものが候補に無い');
    for (const cells of candidates) {
      for (let i = 0; i < board.grid.length; i += 1) {
        const value = board.grid[i];
        if (value !== null && value !== HOLE) assertSame(cells[i], value, `${i} マス目が食い違う`);
      }
    }
  });

  test(`詰みの盤面には 1 つも当てはまらない（${spec.label}）`, () => {
    // F を左上へ置くと (0,0) が 1 マス残り、5 マスのピースでは埋められない。
    const board = place(createBoard(spec), 'F', cellsOf('F'), 0, 0);
    assertSame(consistentSolutions(solutions, board).length, 0, '候補が残った');
    assert(!hasSolution(solutions, board), '解けると言われた');
  });

  test(`autoFrom は一番若い空きマスを覆う 1 手を返す（${spec.label}）`, () => {
    const board = place(createBoard(spec), 'X', cellsOf('X'), 0, 2);
    const result = autoFrom(solutions, board);
    assert(result.ok, 'おまかせが出なかった');
    const target = emptyCells(board)[0];
    const covers = result.placement.cells
      .some(([dr, dc]) => result.placement.row + dr === target[0]
        && result.placement.col + dc === target[1]);
    assert(covers, `一番若い空きマス (${target}) を覆っていない`);
    assert(canPlace(board, result.placement.cells, result.placement.row, result.placement.col).ok,
      '返ってきた置き方が盤に合わない');
  });

  test(`autoFrom は詰みの盤面で解なしを返す（${spec.label}）`, () => {
    const board = place(createBoard(spec), 'F', cellsOf('F'), 0, 0);
    const result = autoFrom(solutions, board);
    assert(!result.ok, '解が出てしまった');
    assertSame(result.placement, null);
  });

  test(`autoFrom は選ぶ解を差し替えると違う手も返す（${spec.label}）`, () => {
    // 乱数を差し替えられないと、無作為に選んでいることをテストで押さえられない。
    const seen = new Set();
    for (const at of [0, 0.25, 0.5, 0.75, 0.99]) {
      const result = autoFrom(solutions, emptyBoard, () => at);
      assert(result.ok, 'おまかせが出なかった');
      const p = result.placement;
      seen.add(`${p.name}@${p.row},${p.col}:${p.cells.map((c) => c.join('')).join('-')}`);
    }
    assert(seen.size > 1, `5 通り試して同じ手だった: ${[...seen][0]}`);
  });

  // ---- TODO-016：既に出した解を避ける ------------------------------------

  test(`autoFrom は返した手がどの解から来たかを番号で返す（${spec.label}）`, () => {
    const result = autoFrom(solutions, emptyBoard, () => 0);
    assert(result.ok, 'おまかせが出なかった');
    assert(Number.isInteger(result.no) && result.no >= 1 && result.no <= canonical.length,
      `番号が範囲の外: ${result.no}`);
  });

  test(`autoFrom は避けろと言われた番号の解を選ばない（${spec.label}）`, () => {
    // 空の盤なら候補は全解なので、1 つ避けても必ず別の解が残る。
    const first = autoFrom(solutions, emptyBoard, () => 0);
    const avoided = autoFrom(solutions, emptyBoard, () => 0, new Set([first.no]));
    assert(avoided.ok, '避けたらおまかせが出なくなった');
    assert(avoided.no !== first.no, `避けたはずの ${first.no} 番が返った`);
  });

  test(`autoFrom は全部避けると、避けずに選び直す（${spec.label}）`, () => {
    // 8×8 は全 65 解しかないので、遊び込めば必ずこうなる。何も出さないより
    // 既出でも 1 手を出したほうが役に立つ、という割り切り（TODO-016）。
    const all = new Set(canonical.map((cells, index) => index + 1));
    const result = autoFrom(solutions, emptyBoard, () => 0, all);
    assert(result.ok, '候補が尽きたらおまかせが出なくなった');
    assert(all.has(result.no), `データに無い番号が返った: ${result.no}`);
  });

  test(`autoFrom は空の集合を渡しても今までどおり（${spec.label}）`, () => {
    const plain = autoFrom(solutions, emptyBoard, () => 0);
    const empty = autoFrom(solutions, emptyBoard, () => 0, new Set());
    assertSame(empty.no, plain.no, '選ぶ解が変わった');
    assertSame(empty.placement, plain.placement, '返す手が変わった');
  });

  test(`autoFrom は詰みの盤面では番号も null（${spec.label}）`, () => {
    const board = place(createBoard(spec), 'F', cellsOf('F'), 0, 0);
    assertSame(autoFrom(solutions, board, () => 0, new Set([1])).no, null);
  });

  test(`autoFrom を最後まで繰り返すと盤が埋まる（${spec.label}）`, () => {
    // 遊ぶ側は 1 手ずつしか受け取らないので、12 手ぶん繰り返せることを見る。
    let board = emptyBoard;
    for (let i = 0; i < 12; i += 1) {
      const result = autoFrom(solutions, board);
      assert(result.ok, `${i + 1} 手目でおまかせが出なかった`);
      const p = result.placement;
      assert(canPlace(board, p.cells, p.row, p.col).ok, `${i + 1} 手目が置けない`);
      board = place(board, p.name, p.cells, p.row, p.col);
    }
    assert(isSolved(board), '空きマスが残った');
    assert(solutionNumber(solutions, boardKey(board)) !== null, '出来上がりがデータに無い');
  });
}

// ---- storage：遊びかけの検証（TODO-030）----------------------------------

group('src/storage.js — 遊びかけの検証（sanitizeProgress）');

/**
 * 全解のデータの 1 件（60 マスの文字列）から遊びかけを組み立てる。
 * `inTray` に挙げたピースだけトレイへ戻すので、盤に置いてある分は
 * 必ず重ならず、盤の中に収まっている。
 */
function progressFrom(spec, cells, inTray) {
  const found = new Map();
  for (let i = 0; i < cells.length; i += 1) {
    const ch = cells[i];
    if (ch === HOLE) continue;
    if (!found.has(ch)) found.set(ch, []);
    found.get(ch).push([Math.floor(i / spec.cols), i % spec.cols]);
  }
  const pieces = PIECES.map((definition) => {
    if (inTray.includes(definition.name)) {
      return {
        name: definition.name, cells: normalize(definition.cells), location: 'tray', row: 0, col: 0,
      };
    }
    const placed = found.get(definition.name);
    const row = Math.min(...placed.map(([r]) => r));
    const col = Math.min(...placed.map(([, c]) => c));
    return {
      name: definition.name,
      cells: placed.map(([r, c]) => [r - row, c - col]),
      location: 'board',
      row,
      col,
    };
  });
  return { ms: 12345, pieces };
}

//
// ここだけ本物の localStorage を触る。利用者が実際に遊んだ記録を消さない
// よう、対象キー（historyKey・storageKey の両方）をテストの前に退避し、
// try/finally で必ず元へ戻す（途中で assert が落ちても戻すため）。

group('src/storage.js — 保存して読み出す');

/**
 * その盤の保存先を空にして `fn` を走らせ、終わったら元の値へ戻す。
 * assert が落ちても戻せるよう `finally` で書き戻す。
 */
function withCleanStorage(spec, fn) {
  const keys = [
    spec.historyKey, spec.storageKey, spec.foundKey, spec.autoKey, spec.progressKey,
  ];
  const saved = keys.map((key) => window.localStorage.getItem(key));
  window.localStorage.removeItem(spec.historyKey);
  window.localStorage.removeItem(spec.foundKey);
  window.localStorage.removeItem(spec.autoKey);
  window.localStorage.removeItem(spec.progressKey);
  try {
    fn();
  } finally {
    keys.forEach((key, index) => {
      if (saved[index] === null) window.localStorage.removeItem(key);
      else window.localStorage.setItem(key, saved[index]);
    });
  }
}

        { at: 2000, ms: 200, no: 2, a: true });
      assertSame(status, 'new', '結果');
      assertSame(list, [{ at: 2000, ms: 200, no: 2, a: true }, { at: 1000, ms: 100, no: 1 }]);
    });
  });

  test(`印ありの記録を印なしの回が上書きし（遅くても）、先頭へ移して 'improved' を返す（${spec.label}）`, () => {
    withCleanStorage(spec, () => {
      const { status, list } = recordOnto(
        [{ at: 2000, ms: 200, no: 2 }, { at: 1000, ms: 100, no: 5, a: true, h: true }],
        { at: 3000, ms: 900, no: 5 });
      assertSame(status, 'improved', '結果');
      assertSame(list, [{ at: 3000, ms: 900, no: 5 }, { at: 2000, ms: 200, no: 2 }]);
      // 読むときのまとめ（dedupeHistory）に頼らず、保存の時点で 1 件になっている。
      assertSame(JSON.parse(window.localStorage.getItem(spec.historyKey)).length, 2,
        '保存した件数');
    });
  });

  test(`印が同じなら短い回が上書きし、'improved' を返す（${spec.label}）`, () => {
    withCleanStorage(spec, () => {
      const { status, list } = recordOnto([{ at: 1000, ms: 500, no: 5, h: true }],
        { at: 2000, ms: 300, no: 5, h: true });
      assertSame(status, 'improved', '結果');
      assertSame(list, [{ at: 2000, ms: 300, no: 5, h: true }]);
    });
  });

  test(`印なしの記録は、印ありで速い回に上書きされず 'kept'（${spec.label}）`, () => {
    withCleanStorage(spec, () => {
      const { status, list } = recordOnto([{ at: 1000, ms: 900, no: 5 }],
        { at: 2000, ms: 100, no: 5, a: true });
      assertSame(status, 'kept', '結果');
      assertSame(list, [{ at: 1000, ms: 900, no: 5 }]);
    });
  });

  test(`印が同じで遅い回・同じ時間の回は何も変えず 'kept'（${spec.label}）`, () => {
    withCleanStorage(spec, () => {
      for (const ms of [600, 500]) {
        const { status, list } = recordOnto([{ at: 1000, ms: 500, no: 5 }],
          { at: 2000, ms, no: 5 });
        assertSame(status, 'kept', `ms: ${ms} の結果`);
        assertSame(list, [{ at: 1000, ms: 500, no: 5 }], `ms: ${ms} の履歴`);
      }
    });
  });

  test(`同じ解が複数ある履歴は、読むと成績が一番よい 1 件にまとまる（${spec.label}）`, () => {
    withCleanStorage(spec, () => {
      window.localStorage.setItem(spec.historyKey, JSON.stringify([
        { at: 3000, ms: 100, no: 5, a: true },
        { at: 2000, ms: 800, no: 5 },
        { at: 1000, ms: 400, no: 5 },
      ]));
      assertSame(loadHistory(spec.key, solutions), [{ at: 1000, ms: 400, no: 5 }]);
    });
  });

  test(`recordClear は最短時間（loadBest）に触らない（${spec.label}）`, () => {
    // 最短時間は自力の回だけ本編が saveBest で更新する（shouldRecordBest）。
    withCleanStorage(spec, () => {
      window.localStorage.setItem(spec.storageKey, '12345');
      recordOnto([], { at: 1000, ms: 100, no: 1 });
      recordOnto([{ at: 1000, ms: 900, no: 1 }], { at: 2000, ms: 100, no: 1 });
      assertSame(loadBest(spec.key), 12345, '最短時間が変わった');
    });
  });

  // ---- TODO-072：完成した 1 回を記録へまとめて反映する（recordCompletion）----

  test(`recordCompletion: 自力の回は最短時間・履歴・見つけた解を更新する（${spec.label}）`, () => {
    withCleanStorage(spec, () => {
      window.localStorage.setItem(spec.storageKey, '12345');
      const result = recordCompletion(spec.key, {
        at: 1000, ms: 100, no: 3, usedAuto: false, usedHint: false,
      }, solutions);
      assertSame(result, { best: 100, updated: true, status: 'new' }, '戻り値');
      assertSame(loadBest(spec.key), 100, '最短時間');
      assertSame(loadHistory(spec.key, solutions), [{ at: 1000, ms: 100, no: 3 }], '履歴');
      assertSame(loadFound(spec.key, total), [3], '見つけた解');
    });
  });

  test(`recordCompletion: 頼った回は最短時間に入れず、履歴（印つき）と見つけた解には残す（${spec.label}）`, () => {
    withCleanStorage(spec, () => {
      window.localStorage.setItem(spec.storageKey, '12345');
      const result = recordCompletion(spec.key, {
        at: 1000, ms: 100, no: 3, usedAuto: true, usedHint: true,
      }, solutions);
      assertSame(result, { best: 12345, updated: false, status: 'new' }, '戻り値');
      assertSame(loadBest(spec.key), 12345, '最短時間が変わった');
      assertSame(loadHistory(spec.key, solutions),
        [{ at: 1000, ms: 100, no: 3, a: true, h: true }], '履歴');
      assertSame(loadFound(spec.key, total), [3], '見つけた解');
    });
  });

  test(`recordCompletion: 番号が無ければ履歴にも見つけた解にも残さない（${spec.label}）`, () => {
    withCleanStorage(spec, () => {
      const result = recordCompletion(spec.key, {
        at: 1000, ms: 100, no: null, usedAuto: true, usedHint: false,
      }, solutions);
      assertSame(result.status, null, '結果');
      assertSame(loadHistory(spec.key, solutions), [], '履歴');
      assertSame(loadFound(spec.key, total), [], '見つけた解');
    });
  });

  // ---- TODO-030：遊びかけを保存して読み出す --------------------------------

  test(`saveProgress で保存したものが loadProgress で戻る（${spec.label}）`, () => {
    withCleanStorage(spec, () => {
      const progress = progressFrom(spec, canonical[0], ['X', 'F']);
      saveProgress(spec.key, progress);
      const loaded = loadProgress(spec.key);
      assert(loaded !== null, '保存したものが読めない');
      assertSame(loaded.ms, progress.ms, '経過時間');
      assertSame(loaded.pieces.filter((p) => p.location === 'board').length,
        PIECES.length - 2, '盤に置いてある数');
    });
  });

  test(`完成した盤面と、完成させた解の番号も保存して戻る（${spec.label}）`, () => {
    withCleanStorage(spec, () => {
      saveProgress(spec.key, { ...progressFrom(spec, canonical[0], []), solved: [1, 2] });
      const loaded = loadProgress(spec.key);
      assert(loaded !== null, '完成した盤面が読めない');
      assertSame(loaded.solved, [1, 2], '完成させた解の番号');
    });
  });

  test(`完成させた解の番号を持たない前の形の遊びかけも読める（${spec.label}）`, () => {
    withCleanStorage(spec, () => {
      window.localStorage.setItem(spec.progressKey,
        JSON.stringify(progressFrom(spec, canonical[0], ['X'])));
      const loaded = loadProgress(spec.key);
      assert(loaded !== null, '前の形が読めない');
      assertSame(loaded.solved, [], '完成させた解の番号');
    });
  });

  test(`遊びかけが無ければ loadProgress は null（${spec.label}）`, () => {
    withCleanStorage(spec, () => {
      assertSame(loadProgress(spec.key), null);
    });
  });

  test(`clearProgress の後は null になる（${spec.label}）`, () => {
    withCleanStorage(spec, () => {
      saveProgress(spec.key, progressFrom(spec, canonical[0], ['X']));
      clearProgress(spec.key);
      assertSame(loadProgress(spec.key), null);
    });
  });

  test(`使えない遊びかけを渡すと、前のものごと消える（${spec.label}）`, () => {
    // 古い遊びかけが残って、続きから始めたときに前の盤面が出るのを防ぐ。
    withCleanStorage(spec, () => {
      saveProgress(spec.key, progressFrom(spec, canonical[0], ['X', 'F']));
      assertSame(saveProgress(spec.key, { ms: -1, pieces: [] }), null, '戻り値');
      assertSame(loadProgress(spec.key), null, '前の遊びかけが残っている');
    });
  });

  test(`遊びかけは履歴・達成度と別に保たれる（${spec.label}）`, () => {
    withCleanStorage(spec, () => {
      saveProgress(spec.key, progressFrom(spec, canonical[0], ['X']));
      recordClear(spec.key, { at: 1000, ms: 100, no: 1 }, solutions);
      window.localStorage.removeItem(spec.historyKey);
      clearFound(spec.key);
      assert(loadProgress(spec.key) !== null, '記録を消したら遊びかけまで消えた');
    });
  });

  test(`removeFound は履歴（loadHistory）を消さない（${spec.label}）`, () => {
    withCleanStorage(spec, () => {
      recordClear(spec.key, { at: 1000, ms: 100, no: 1 }, solutions);
      addFound(spec.key, 1, total);
      removeFound(spec.key, 1, total);
      assertSame(loadHistory(spec.key, solutions).length, 1, '履歴まで消えた');
    });
  });
}

// ---- 結果の表示 ---------------------------------------------------------

const results = document.getElementById('results');
let passed = 0;
let failed = 0;

for (const entry of groups) {
  const heading = document.createElement('h2');
  heading.textContent = entry.title;
  results.appendChild(heading);
  const list = document.createElement('ul');
  for (const item of entry.cases) {
    const li = document.createElement('li');
    li.className = item.ok ? 'ok' : 'ng';
    li.textContent = item.title;
    if (!item.ok) {
      const why = document.createElement('span');
      why.className = 'why';
      why.textContent = item.why;
      li.appendChild(why);
      failed += 1;
    } else {
      passed += 1;
    }
    list.appendChild(li);
  }
  results.appendChild(list);
}

const summary = document.getElementById('summary');
summary.className = failed === 0 ? 'pass' : 'fail';
summary.textContent = failed === 0
  ? `${passed} 件すべて通った`
  : `${failed} 件が失敗（${passed} 件は通った）`;

const note = document.createElement('p');
note.className = 'note';
const dataNote = boardStates
  .map(({ spec, canonical, solutions }) => (
    `${spec.label} は代表形 ${canonical.length} 件（展開すると ${solutions.keys.length} 解）`))
  .join('、');
note.textContent = `参考: 読み込んだ全解のデータ — ${dataNote}。`;
results.appendChild(note);
</script>
</body>
</html>
